name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The reference artifacts in docs/ are not application code, but they are real
  # TypeScript and they cross-import — docs/machines/course.machine.ts imports
  # LiveState from offering.machine, and docs/permissions/ and docs/fixtures/
  # name the state unions offering.machine exports. Nothing catches a typo'd
  # state name except this.
  #
  # Settled by "Where does the rest of the spec live?" (#50). It survives the
  # arrival of the application (#75), pointed at tsconfig.docs.json — the app
  # has its own tsconfig and `docs/` is excluded from it.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # The alarm for a machine changed without a migration behind it (#13, #76).
  # `db/machine-states.test.ts` asserts that each CHECK constraint in the applied
  # migration admits exactly the states its machine declares — the detection
  # mechanism that replaced a `machine_version` column, in a map where renaming
  # an occupied state invalidates every persisted snapshot. It reads SQL and
  # TypeScript and needs no database, which is why it can run here.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test

  # **The permission matrix's satisfiability test** (#28, #49, #78). Why a seed
  # that fails to run is the loudest available report of a hole in the rules is
  # argued in `db/seed.ts`; this job is what makes it fire on every push.
  #
  # It also exercises what nothing else in CI can: the real CHECK constraints, the
  # generated `status` columns, the locking transactions, and the cross-project
  # check that a roster netid is somebody `people` knows. Both projects are
  # databases on one server, which is all the two connection strings ever mean.
  seed:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Four strings because a deployment has four (#5, #9): pooled at runtime,
      # direct for migrations. One server here, so they differ only in the
      # database they name.
      PEOPLE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/people
      CLASSES_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/classes
      PEOPLE_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/people
      CLASSES_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/classes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: create both projects
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c 'CREATE DATABASE people'
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c 'CREATE DATABASE classes'
      # Drops both, migrates both, seeds both — one command, because coherence is
      # a property of `db:reset` and not of the databases (#9, #13).
      - run: npm run db:reset

  # `npm run build` is `eslint . && next build`, in that order and on purpose:
  # ESLint is what makes a page importing a database handle **fail the build**
  # rather than merely warn (#9, #75). Next 16 does not lint during `next build`
  # of its own accord, so the boundary is only structural because this line puts
  # it in front of the compiler.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
