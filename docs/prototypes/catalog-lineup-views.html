<title>Catalog & Lineup — three variants</title>

<!--
  PROTOTYPE — throwaway. Answers issue #37, "What do the Catalog and Lineup views display?"

  Three variants of the two list views, switchable via ?variant= and the floating
  bar at the bottom. Hand-written fixtures, no data layer, no framework — this is a
  static approximation of Next.js + Mantine + mantine-datatable, built to be reacted
  to, not to be promoted.

    A — Flat table         one row per Offering, every fact a column
    B — Grouped by course  course header rows, sections nested beneath
    C — Listing rows       two-line records, actions and refusals visible inline

  The header's "viewing as" switcher is real: it re-filters the row set the way
  #28's read tiers do, and swaps the per-row permitted-action sets.
-->

<script>
/* ==========================================================================
   Fixtures — hand-written, shaped to the curated schema in docs/schema/.
   Deliberately exercises: seat-shared foreign tags, a course with no area,
   a roster netid with no person row, a term with three sections of one course,
   and the six states a student may not see.
   ========================================================================== */

  na2481: "Nora Applebaum",
  tv1067: "Theo Vance",
  pr3390: "Priya Raman",
  mo5512: "Marcus Ola",
  xq7742: null,                      // roster netid `people` does not know

const ACTORS = [
  { netid: "pr3390", roles: ["coordinator", "program_director"], programs: ["ITP"], label: "Priya Raman — coordinator + ITP director" },
  { netid: "na2481", roles: ["instructor", "area_head"],         programs: [],      label: "Nora Applebaum — instructor + area head" },
  { netid: "mo5512", roles: ["student"],                          programs: [],      label: "Marcus Ola — student" },
  { netid: "tv1067", roles: ["chair", "instructor"],              programs: [],      label: "Theo Vance — chair (+ instructor)" },

  { code: "20253", label: "Fall 2025" },
  { code: "20261", label: "Spring 2026" },
];

const COMMITTED = ["Accepted","Scheduled","Published","Listed","Running","Evaluating","Concluded","Canceled"];

const TONE = {
  Slated:"idle", Staffed:"wait", Offered:"wait", Deferred:"wait", Declined:"stop", Dead:"stop",
  Accepted:"live", Scheduled:"live", Published:"live", Listed:"live", Running:"live",
  Evaluating:"idle", Concluded:"idle", Canceled:"stop",
  Approved:"live", Revising:"wait", Retired:"idle",

/* --- courses ------------------------------------------------------------ */

const COURSES = [
  { id:1, prog:"ITP", number:"ITPG-GT 2233", title:"Physical Computing", credits:4, edition:3,
    state:"Approved", areaHead:"na2481",
    areas:[{p:"ITP",n:"Physical Interaction"}],
    cats:[{p:"ITP",n:"Core"}] },

/* ==========================================================================
   Read model — the two composed row shapes from #9, assembled here the way
   getCatalogPage / getLineupPage would assemble them server-side.
   ========================================================================== */

const course = id => COURSES.find(c => c.id === id);
const isDirectorOf = (a, p) => a.roles.includes("program_director") && a.programs.includes(p);
const isChair = a => a.roles.includes("chair");
const canAct = a => a.roles.some(r => ["instructor","coordinator","program_director","area_head","chair"].includes(r));

/* #28 tier 1/2: `student` and `advisor` see only COMMITTED_STATES. A hidden row
   is absent, never flagged. */
function visibleOfferings(actor, term) {
  return OFFERINGS
    .filter(o => o.term === term)
    .filter(o => canAct(actor) ? true : COMMITTED.includes(o.state));
}

/* The Catalog's row set: a Course eligible to be offered, now or in future. */
function visibleCourses() {
  return COURSES.filter(c => c.state !== "Retired");
}

/* Per-row permitted-action set: machine legality ∩ invariants ∩ permissions,
   already intersected server-side. A refusal ships with its reason attached —
   #14's rule that the rule and the explanation are one object. */
const OFFERING_EVENTS = {
  Slated:    ["staff","kill"],
  Staffed:   ["offer","unstaff","kill"],
  Offered:   ["accept","decline","withdraw","defer"],
  Deferred:  ["accept","decline","withdraw"],
  Accepted:  ["schedule","decline","cancel"],
  Declined:  ["retry","kill"],
  Scheduled: ["publish","decline","cancel"],
  Published: ["list","decline","cancel"],
  Listed:    ["run","cancel"],
  Running:   ["evaluate","cancel"],
  Evaluating:["conclude"],
  Canceled:  ["retry","kill"],
  Concluded: [], Dead: [],
};

const LEAD_ONLY = ["accept","decline","defer"];

function offeringActions(actor, o) {
  const c = course(o.course);
  const lead = o.roster[0] ?? null;
  return (OFFERING_EVENTS[o.state] ?? []).map(ev => {
    if (LEAD_ONLY.includes(ev)) {
      if (lead === actor.netid) return { ev, ok: true };
      if (!lead) return { ev, ok: false, why: "No lead instructor to answer for this section" };
      return { ev, ok: false, why: `Only ${nameOf(lead)}, the lead instructor, can ${ev} this` };
    }
    if (ev === "retry" && o.state === "Canceled" && !lead)
      return { ev, ok: false, why: "Nothing to reinstate — this section has no instructor" };
    if (isChair(actor)) return { ev, ok: true };
    if (isDirectorOf(actor, c.prog) || (actor.roles.includes("coordinator") && c.prog === "ITP"))
      return { ev, ok: true };
    if (actor.roles.includes("area_head") && c.areaHead === actor.netid)
      return { ev, ok: false, why: `Heading an area lets you approve the course, not run its sections` };
    return { ev, ok: false, why: `${c.prog} offerings are the ${c.prog} director's to move` };
  });
}

function courseActions(actor, c) {
  return ["revise","retire"].map(ev => {
    if (ev === "retire" && c.state === "Revising")
      return { ev, ok: isChair(actor) || isDirectorOf(actor, c.prog), why: "Only a program director may retire a course" };
    if (c.state === "Revising" && ev === "revise")
      return { ev: "approve", ok: isChair(actor) || isDirectorOf(actor, c.prog) || c.areaHead === actor.netid,
               why: `Approving a ${c.prog} revision is for the ${c.prog} director or the course's area head` };
    if (isChair(actor)) return { ev, ok: true };
    if (isDirectorOf(actor, c.prog)) return { ev, ok: true };
    if (c.areaHead === actor.netid)
      return { ev, ok: false, why: "An area head signs off on revisions but does not open them" };
    return { ev, ok: false, why: `${c.prog} courses are the ${c.prog} director's to change` };
  });
}

/* #9: displayName is nullable and a roster entry is never dropped for want of a
   name. The fallback is the netid — a real identifier at NYU, not a placeholder. */
function nameOf(netid) { return PEOPLE[netid] ?? netid; }
function personCell(netid, lead) {
  const name = PEOPLE[netid];
  const mark = lead ? '<span class="lead-mark">lead</span>' : "";
  return name
    ? `<span>${name}</span>${mark}`
    : `<span class="netid-fallback">${netid}</span>${mark}`;
}

/* ==========================================================================
   Rendering
   ========================================================================== */

const state = {
  variant: "A",
  view: "lineup",
  actor: ACTORS[0],
  term: "20253",
  prog: "",
  status: "",
  q: "",
};

const VARIANTS = {
  A: "Flat table",
  B: "Grouped by course",
  C: "Listing rows",
};

const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function chip(p, n, foreign) {
  const cls = p.toLowerCase();
  const label = foreign ? `${p} · ${n}` : n;
  return `<span class="chip ${cls}${foreign ? " foreign" : ""}"${
    foreign ? ` title="Seats shared with ${p}"` : ""}>${esc(label)}</span>`;
}

function tagCell(own, foreign) {
  const bits = [
    ...own.map(t => chip(t.p, t.n, false)),
    ...foreign.map(t => chip(t.p, t.n, true)),
  ];
  return bits.length ? `<div class="chips">${bits.join("")}</div>` : `<span class="none">—</span>`;
}

function stateChip(s) { return `<span class="state ${TONE[s]}">${s}</span>`; }

function rosterCell(roster) {
  if (!roster.length) return `<span class="none">Needs an instructor</span>`;
  return roster.map((n, i) => personCell(n, i === 0 && roster.length > 1)).join(", ");
}

function actionMenu(actions) {
  if (!actions.length) return `<span class="none">—</span>`;
  const items = actions.map(a => a.ok
    ? `<span class="menu-item ok">${a.ev}</span>`
    : `<span class="menu-item no">${a.ev}<span class="why">${esc(a.why)}</span></span>`).join("");
  const n = actions.filter(a => a.ok).length;
  return `<details class="menu"><summary>⋯ ${n}</summary><div class="menu-body">${items}</div></details>`;
}

function actionButtons(actions) {
  if (!actions.length) return `<span class="none">No moves from here</span>`;
  const btns = actions.map((a, i) => a.ok
    ? `<button class="vbtn${i === 0 ? " primary" : ""}">${a.ev}</button>`
    : `<button class="vbtn" disabled>${a.ev}</button>`).join("");
  const refusals = actions.filter(a => !a.ok).map(a =>
    `<span class="refusal"><b>${a.ev}</b> — ${esc(a.why)}</span>`).join("");
  return `<div class="actbtns">${btns}</div>${refusals ? `<div class="refusals">${refusals}</div>` : ""}`;
}

/* --- filters ------------------------------------------------------------ */

function matches(text) { return !state.q || text.toLowerCase().includes(state.q.toLowerCase()); }

function catalogRows() {
  return visibleCourses()
    .filter(c => !state.prog || c.prog === state.prog)
    .filter(c => !state.status || c.state === state.status)
    .filter(c => matches(`${c.number} ${c.title} ${nameOf(c.areaHead ?? "")}`));
}

function lineupRows() {
  return visibleOfferings(state.actor, state.term)
    .filter(o => !state.prog || course(o.course).prog === state.prog)
    .filter(o => !state.status || o.state === state.status)
    .filter(o => {
      const c = course(o.course);
      return matches(`${c.number} ${c.title} ${o.roster.map(nameOf).join(" ")} ${o.roster.join(" ")}`);
    });
}

/* --- variant A: flat table ---------------------------------------------- */

function catalogA(rows) {
  if (!rows.length) return emptyCatalog();
  return `<div class="tablewrap"><table>
    <thead><tr>
      <th class="sortable sorted">Number</th>

function lineupA(rows) {
  if (!rows.length) return emptyLineup();
  return `<div class="tablewrap"><table>
    <thead><tr>
      <th class="sortable sorted">Number</th>
      <th class="sortable">Title</th>
      <th class="sortable rt">Sec</th>
      <th class="sortable">Status</th>
      <th class="nosort">Instructors</th>

      <th class="nosort">Areas</th>

      <th class="nosort rt">Actions</th>

    ${rows.map(o => { const c = course(o.course); return `<tr>
      <td class="num">${c.number}</td>
      <td class="title">${esc(c.title)}<div class="sub">${chipInline(c.prog)}</div></td>

      <td class="rt">${actionMenu(offeringActions(state.actor, o))}</td>
    </tr>`; }).join("")}
    </tbody></table></div>`;
}

function chipInline(p) { return `<span class="chip ${p.toLowerCase()}">${p}</span>`; }

/* --- variant B: grouped by course --------------------------------------- */

function groupBy(rows, key) {
  const m = new Map();
  for (const r of rows) { const k = key(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); }
  return m;
}

function catalogB(rows) {
  if (!rows.length) return emptyCatalog();
  const groups = groupBy(rows, c => c.prog);
  let html = `<div class="tablewrap"><table>
    <thead><tr>
      <th class="sortable sorted">Number</th><th class="sortable">Title</th>
      <th class="sortable rt">Cr</th><th class="nosort">Areas</th>
      <th class="nosort">Requirements</th><th class="sortable">Area head</th>
      <th class="sortable">Status</th><th class="nosort rt">Actions</th>
    </tr></thead><tbody>`;
  for (const [prog, cs] of groups) {
    html += `<tr class="group-head"><td colspan="8"><div class="group-line">
      ${chipInline(prog)}
      <span class="title">${prog === "ITP" ? "Interactive Telecommunications"
                          : prog === "IMA" ? "Interactive Media Arts" : "IMA Low Residency"}</span>
      <span class="group-meta"><span class="group-count">${cs.length} course${cs.length===1?"":"s"}</span></span>
    </div></td></tr>`;
    html += cs.map(c => `<tr>
      <td class="num indent">${c.number}</td>
      <td class="title">${esc(c.title)}</td>
      <td class="rt">${c.credits}</td>
      <td>${tagCell(c.areas, [])}</td>
      <td>${tagCell(c.cats, [])}</td>
      <td>${c.areaHead ? personCell(c.areaHead, false) : `<span class="none">Unassigned</span>`}</td>
      <td>${stateChip(c.state)}</td>
      <td class="rt">${actionMenu(courseActions(state.actor, c))}</td>
    </tr>`).join("");
  }
  return html + `</tbody></table></div>`;
}

function lineupB(rows) {
  /* The group is (course_id, term_code) — single-program by construction since
     #30, so no group needs an own-program label to tell it from its siblings. */
  const groups = groupBy(rows, o => o.course);
  const shown = new Set(groups.keys());

  /* A group can be empty for a student and populated for a coordinator. Show the
     courses that *are* offered this term but whose sections this actor can't see. */
  const emptied = [...new Set(OFFERINGS.filter(o => o.term === state.term).map(o => o.course))]
    .filter(id => !shown.has(id))
    .filter(id => !state.prog || course(id).prog === state.prog);

  if (!rows.length && !emptied.length) return emptyLineup();

  let html = `<div class="tablewrap"><table>
    <thead><tr>
      <th class="sortable sorted rt">Sec</th><th class="sortable">Status</th>
      <th class="nosort">Instructors</th><th class="nosort">Meets</th>
      <th class="sortable rt">Cap</th><th class="nosort">Shared with</th>
      <th class="nosort rt">Actions</th>
    </tr></thead><tbody>`;

  for (const [cid, os] of groups) {
    const c = course(cid);
    html += `<tr class="group-head"><td colspan="7"><div class="group-line">
      <span class="num">${c.number}</span>
      <span class="title">${esc(c.title)}</span>
      <span class="sub">${c.credits} cr</span>
      <span class="group-meta">
        ${tagCell(c.areas, [])}${tagCell(c.cats, [])}
        <span class="group-count">${os.length} section${os.length===1?"":"s"}</span>
      </span>
    </div></td></tr>`;
    html += os.map(o => `<tr>
      <td class="rt num indent">${o.section}</td>
      <td>${stateChip(o.state)}</td>
      <td>${rosterCell(o.roster)}</td>
      <td><span class="num">${esc(o.meets.text)}</span>${o.meets.room ? `<div class="sub">${o.meets.room}</div>` : ""}</td>
      <td class="rt">${o.cap}</td>
      <td>${tagCell([], [...o.foreignAreas, ...o.foreignCats])}</td>
      <td class="rt">${actionMenu(offeringActions(state.actor, o))}</td>
    </tr>`).join("");
  }

  for (const cid of emptied) {
    const c = course(cid);
    html += `<tr class="group-head"><td colspan="7"><div class="group-line">
      <span class="num">${c.number}</span><span class="title">${esc(c.title)}</span>
      <span class="sub">${c.credits} cr</span>
    </div></td></tr>
    <tr class="group-empty"><td colspan="7">Nothing confirmed for this term yet.</td></tr>`;
  }

  return html + `</tbody></table></div>`;
}

/* --- variant C: listing rows -------------------------------------------- */

function catalogC(rows) {
  if (!rows.length) return emptyCatalog();
  return `<div class="listing">${rows.map(c => `

function lineupC(rows) {
  if (!rows.length) return emptyLineup();
  return `<div class="listing">${rows.map(o => { const c = course(o.course); return `
    <div class="record">
      <div class="body">

          <span class="seg"><span class="k">Cap</span>${o.cap}</span>
        </div>

                                          [...o.foreignAreas, ...o.foreignCats])}</div>

/* --- empty states ------------------------------------------------------- */

function emptyLineup() {
  const t = TERMS.find(t => t.code === state.term).label;
  const filtered = state.q || state.prog || state.status;
  return `<div class="empty">
    <h3>${filtered ? "Nothing matches those filters" : `No classes in ${t} yet`}</h3>
    <p>${filtered
      ? "Clear the search or the program and status filters to see the whole term."
      : canAct(state.actor)
        ? `Sections appear here as soon as a course is slated for ${t}.`
        : `Once instructors have agreed to teach, ${t}'s classes will show up here.`}</p>
  </div>`;
}

function emptyCatalog() {
  return `<div class="empty">
    <h3>No courses match</h3>
    <p>Clear the search or the program filter. Retired courses are hidden — they can no longer be offered.</p>
  </div>`;
}

/* --- shell -------------------------------------------------------------- */

const NOTES = {
  A: "<b>A — Flat table.</b> One row per offering, every fact its own column, sortable where the database can sort it. Closest to legacy <code>lineup_official</code> and to a spreadsheet. Three sections of Physical Computing read as three unrelated rows.",
  B: "<b>B — Grouped by course.</b> The Lineup groups on <code>(course_id, term_code)</code>; the Catalog groups by program. Course-level facts sit on the header, section-level facts on the rows beneath. A group that is empty for you but populated for a coordinator still appears, so a term reads honestly.",
  C: "<b>C — Listing rows.</b> Two lines per record, like a printed course bulletin. Actions are visible buttons and every refusal states its reason in the open rather than hiding it behind a hover.",
};

function render() {
  const isCat = state.view === "catalog";
  const rows = isCat ? catalogRows() : lineupRows();

  const body =
    state.variant === "A" ? (isCat ? catalogA(rows) : lineupA(rows)) :
    state.variant === "B" ? (isCat ? catalogB(rows) : lineupB(rows)) :
                            (isCat ? catalogC(rows) : lineupC(rows));

  document.getElementById("app").innerHTML = `<p class="note">${NOTES[state.variant]}</p>` + body;

  document.getElementById("count").textContent =
    `${rows.length} ${isCat ? (rows.length === 1 ? "course" : "courses")
                            : (rows.length === 1 ? "section" : "sections")}`;

  document.getElementById("term").hidden = isCat;
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", String(t.dataset.view === state.view)));

  const st = document.getElementById("status");
  const opts = isCat ? ["Approved","Revising"] : Object.keys(TONE).slice(0, 14);
  st.innerHTML = `<option value="">Any status</option>` +
    opts.map(s => `<option${s === state.status ? " selected" : ""}>${s}</option>`).join("");

  document.getElementById("vkey").textContent = state.variant;
  document.getElementById("vname").textContent = VARIANTS[state.variant];

  const u = new URL(location.href);
  u.searchParams.set("variant", state.variant);
  history.replaceState(null, "", u);
}

/* --- wiring ------------------------------------------------------------- */

const actorSel = document.getElementById("actor");
actorSel.innerHTML = ACTORS.map((a, i) => `<option value="${i}">${a.label}</option>`).join("");
actorSel.onchange = e => { state.actor = ACTORS[+e.target.value]; render(); };

const termSel = document.getElementById("term");
termSel.innerHTML = TERMS.map(t => `<option value="${t.code}">${t.label}</option>`).join("");
termSel.onchange = e => { state.term = e.target.value; render(); };

const progSel = document.getElementById("prog");
progSel.innerHTML = `<option value="">All programs</option>` +
  ["ITP","IMA","LOWRES"].map(p => `<option>${p}</option>`).join("");
progSel.onchange = e => { state.prog = e.target.value; render(); };

document.getElementById("status").onchange = e => { state.status = e.target.value; render(); };
document.getElementById("q").oninput = e => { state.q = e.target.value; render(); };

document.querySelectorAll(".tab").forEach(t =>
  t.onclick = () => { state.view = t.dataset.view; render(); });

const keys = Object.keys(VARIANTS);
function cycle(d) {
  const i = keys.indexOf(state.variant);
  state.variant = keys[(i + d + keys.length) % keys.length];
  render();
}
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);

addEventListener("keydown", e => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});

/* one menu open at a time */
addEventListener("click", e => {
  document.querySelectorAll("details.menu[open]").forEach(d => {
    if (!d.contains(e.target)) d.removeAttribute("open");
  });
});

const initial = new URL(location.href).searchParams.get("variant");
if (initial && keys.includes(initial.toUpperCase())) state.variant = initial.toUpperCase();
render();
</script>
