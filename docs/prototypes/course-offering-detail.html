<title>Course and Offering detail pages — four variants, D settled</title>

<!--
  PROTOTYPE — throwaway. Answers issue #41, "What do the Course and Offering
  detail pages show?"

  Three structurally different takes on the two detail pages, switchable with the
  floating bar or the ← → keys. Hand-written fixtures, no data layer, no
  framework — a static approximation of Next.js + Mantine, built to be reacted
  to, not to be promoted.

    D — Settled    the shape the requester assembled from the three — see the
                   resolution on #41. D is the answer; A/B/C are the primary
                   source it was assembled from, kept beside it deliberately.
    A — Dossier    one column, everything stated, history as the raw seven-column
                   table it is stored as
    B — Record     a header card with actions, body split into tabs, history as a
                   sentence per row
    C — Rail       two columns: what the record *is* on the left, what has
                   happened to it and what you may do on the right; history as a
                   readable line with the machine's own values kept visible

  Every **rule** here is already settled and none of it is re-decided in this
  file: #40 fixed the form (a page, not a drawer), refusals in the open, names
  with #37's fallback, a provenance line, seat-sharing granters, `pronouns` on
  people and not on history lines. What differs between the variants is
  presentation, and exactly the six things #41 asks:

                          | A Dossier          | B Record           | C Rail
    reached from a row by | linked identifier  | ⋯ menu item        | a ↗ control
    facts laid out as     | one column, all    | tabs               | main + rail
    history renders as    | raw table          | a sentence per row | line + chips
    course's offerings    | flat, term column  | grouped by term    | term-grouped list
    creation shows in     | provenance only    | timeline, derived  | feed, marked

  Two things this file made visible that were hard to see on paper, both of
  which the resolution acted on:

  1. **The sentence form wants a name the log did not have.** #19 ruled that
     `offer` and `accept` carry no `subject_netid`, the roster answering "who is
     the lead" directly — but the roster answers who the lead is *now*. See
     PComp §3, where the offer went to two different people in one term and
     nobody holds position 0 today. Choosing sentences therefore forced the
     column onto both events, which is #41's one amendment to a closed ticket.
     The fixtures here carry it; the flagged, pre-decision version is one commit
     back on this branch.

  2. **There is no genesis row** (#13), so a history that shows only log rows
     starts mid-story. D derives a creation line to open the history with, and
     drops it from the rail so the fact is stated once.

  The "Viewing as" control is a prototype device for looking at what varies by
  role, not part of the page. A `student` gets no history at all — absent, not
  empty (#40).

  AMENDED by #61, "Who writes co-instructor roster rows?", on one point:

    **The roster is rows carrying their own `position`, not an array indexed by
    convention.** This file shipped `roster[0]` as "the lead", a shape that
    cannot express a gap — and #61 established that gaps below an empty position
    0 are not merely legal but are what `decline` and `withdraw` *produce*, each
    DELETEing position 0 and leaving everything under it. PComp §3 is the case:
    declined, no lead, and now one co-instructor still seated. Under the old
    shape it rendered as an ordinary two-person roster with nothing saying the
    section could not be offered to anyone. So the empty-state set goes from five
    to six — *no roster at all* keeps its copy, and *rows below an empty position
    0* is new, showing the table with the same sentence above it, because the
    fact is still true and is now less obvious rather than more.
-->

/* --- courses ------------------------------------------------------------ */

  { id:103, course:1, term:"20253", section:"3", state:"Declined",

/* --- transition logs ---------------------------------------------------- */
/* Exactly the seven stored columns. **No genesis row** (#13): creation is

const LOG = {

    { event:"revise",  from:"Approved", to:"Revising", actor:"pr3390", subject:null, reason:"Adding a sensors unit for 2024", at:"2023-11-02T10:12" },
    { event:"approve", from:"Revising", to:"Approved", actor:"na2481", subject:null, reason:null, at:"2023-11-20T16:40" },
    { event:"revise",  from:"Approved", to:"Revising", actor:"pr3390", subject:null, reason:"Credits corrected, 2 to 4", at:"2025-01-14T09:05" },
    { event:"approve", from:"Revising", to:"Approved", actor:"pr3390", subject:null, reason:null, at:"2025-01-28T11:30" },
  ],
  "course:3": [],
  "course:6": [],

  "offering:101": [
    { event:"staff",    from:"Slated",    to:"Staffed",   actor:"pr3390", subject:"na2481", reason:null, at:"2025-03-04T13:02" },
    { event:"offer",    from:"Staffed",   to:"Offered",   actor:"pr3390", subject:"na2481", reason:null, at:"2025-03-04T13:03" },
    { event:"accept",   from:"Offered",   to:"Accepted",  actor:"na2481", subject:"na2481", reason:null, at:"2025-03-06T08:47" },
    { event:"schedule", from:"Accepted",  to:"Scheduled", actor:"pr3390", subject:null, reason:null, at:"2025-04-11T10:20" },

  "offering:103": [
    { event:"staff",    from:"Slated",   to:"Staffed",  actor:"pr3390", subject:"tv1067", reason:null, at:"2025-03-04T13:05" },
    { event:"offer",    from:"Staffed",  to:"Offered",  actor:"pr3390", subject:"tv1067", reason:null, at:"2025-03-04T13:06" },

/* --- the records this prototype can open -------------------------------- */

const RECORDS = [
  { key:"c1",  kind:"course",   id:1,   label:"Course · ITPG-GT 2233 Physical Computing — dense history, edition 3",
    note:"Four sections across two terms, two approved revisions, and a field edit the log is forbidden to record." },
  { key:"o101",kind:"offering", id:101, label:"Class · Physical Computing §1, Fall 2025 — Running",
    note:"The full forward path, two co-instructors, two meeting rows in two rooms, seat shared with IMA." },
  { key:"o102",kind:"offering", id:102, label:"Class · Physical Computing §2, Fall 2025 — Slated",
    note:"Decided to run, nobody picked to ask yet. No roster, no call number, no history — the emptiest a real section gets." },
  { key:"o103",kind:"offering", id:103, label:"Class · Physical Computing §3, Fall 2025 — Declined",
    note:"Deferred, withdrawn, re-staffed, declined. Two people held position 0; nobody holds it now — and a co-instructor is still seated at position 1 (#61)." },
  { key:"o108",kind:"offering", id:108, label:"Class · Machine Vision Intensive §1, Spring 2026 — Accepted",
    note:"LowRes: `dates` and `async` meetings, and a lead with no row in `people`." },
  { key:"c3",  kind:"course",   id:3,   label:"Course · ITPG-GT 3011 Speculative Objects — nothing yet",
    note:"No area, no head, no offerings, no history. Every empty state on one page." },
];

/* ==========================================================================
   Read model — assembled here the way `getCoursePage` / `getOfferingPage`
   would assemble it server-side, per #9's view-shaped read modules.
   ========================================================================== */

const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const courseOf = id => COURSES.find(c => c.id === id);
const offeringOf = id => OFFERINGS.find(o => o.id === id);
const offeringsOfCourse = id => OFFERINGS.filter(o => o.course === id);

const isChair = a => a.roles.includes("chair");
const isDirectorOf = (a, p) => a.roles.includes("program_director") && a.programs.includes(p);
const canAct = a => a.roles.some(r => ["instructor","coordinator","program_director","area_head","chair"].includes(r));

/* #9: displayName is nullable, and a roster entry is never dropped for want of
   a name. The fallback is the netid — a real identifier at NYU. */
const nameOf = n => PEOPLE[n]?.name ?? n;
const named = n => PEOPLE[n]
  ? `<span>${esc(PEOPLE[n].name)}</span>`
  : `<span class="netid-fallback">${esc(n)}</span>`;

/* `pronouns` show where a person is presented as a person — the roster — and
   never on a history line, where they are the subject of a timestamp (#40). */
function person(n, { lead = false, pronouns = false } = {}) {
  const p = PEOPLE[n];
  const pr = pronouns && p?.pronouns ? `<span class="pronouns">${esc(p.pronouns)}</span>` : "";
  const mark = lead ? `<span class="lead-mark">lead</span>` : "";
  return `${named(n)}${pr}${mark}`;
}

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmt(iso, { time = true } = {}) {
  if (!iso) return "—";
  const [d, t] = iso.split("T");
  const [y, m, day] = d.split("-");
  const date = `${+day} ${MONTHS[+m - 1]} ${y}`;
  if (!time || !t) return date;
  let [hh, mm] = t.split(":").map(Number);
  const ap = hh < 12 ? "am" : "pm";
  hh = hh % 12 || 12;
  return `${date}, ${hh}:${String(mm).padStart(2, "0")} ${ap}`;
}
const fmtDate = iso => fmt(iso, { time: false });

/* One row per slot, three declared kinds (#10). The display string is gone: the
   view composes from rows, which is why an offering can meet in two rooms. */
function meetingText(m) {
  if (m.kind === "async") return "Asynchronous — no scheduled meeting";
  if (m.kind === "weekly") return `${m.day} ${m.start}–${m.end}`;
  return `${fmtDate(m.from)} – ${fmtDate(m.to)}, ${m.start}–${m.end}`;
}

function notOfferable(c) {
  const missing = [];
  if (!c.areas.length) missing.push("an area");
  if (!c.areaHead) missing.push("an area head");
  return missing.length ? `Needs ${missing.join(" and ")} before it can be offered` : null;
}

/* Per-row permitted-action set: machine legality ∩ invariants ∩ permissions,
   already intersected server-side (#28). A refusal ships with its reason
   attached — #14's rule that the rule and the explanation are one object. */
const OFFERING_EVENTS = {
  Slated:["staff","kill"], Staffed:["offer","unstaff","kill"],
  Offered:["accept","decline","withdraw","defer"], Deferred:["accept","decline","withdraw"],
  Accepted:["schedule","decline","cancel"], Declined:["retry","kill"],
  Scheduled:["publish","decline","cancel"], Published:["list","decline","cancel"],
  Listed:["run","cancel"], Running:["evaluate","cancel"],
  Evaluating:["conclude"], Canceled:["retry","kill"], Concluded:[], Dead:[],
};
const LEAD_ONLY = ["accept","decline","defer"];

function offeringActions(actor, o) {
  const c = courseOf(o.course);
  const lead = leadOf(o);
  return (OFFERING_EVENTS[o.state] ?? []).map(ev => {
    if (LEAD_ONLY.includes(ev)) {
      if (lead === actor.netid) return { ev, ok:true };
      if (!lead) return { ev, ok:false, why:"No lead instructor to answer for this section" };
      return { ev, ok:false, why:`Only ${nameOf(lead)}, the lead instructor, can ${ev} this` };
    }
    if (ev === "retry" && !lead && o.state === "Canceled")
      return { ev, ok:false, why:"Nothing to reinstate — this section has no instructor" };
    if (isChair(actor)) return { ev, ok:true };
    if (isDirectorOf(actor, c.prog) || (actor.roles.includes("coordinator") && c.prog === "ITP"))
      return { ev, ok:true };
    if (actor.roles.includes("area_head") && c.areaHead === actor.netid)
      return { ev, ok:false, why:"Heading an area lets you approve the course, not run its sections" };
    return { ev, ok:false, why:`${c.prog} sections are the ${c.prog} director's to move` };
  });
}

function courseActions(actor, c) {
  const evs = c.state === "Revising" ? ["approve","retire"]
            : c.state === "Retired"  ? []
            : ["revise","retire"];
  const live = offeringsOfCourse(c.id).filter(o =>
    ["Slated","Staffed","Offered","Accepted","Deferred","Scheduled","Published","Listed","Running"].includes(o.state));
  return evs.map(ev => {
    if (ev === "retire" && live.length) {
      const list = live.map(o => `§${o.section} ${TERMS[o.term]}`).join(", ");
      return { ev, ok:false, why:`${live.length} section${live.length > 1 ? "s are" : " is"} still live — ${list}` };
    }
    if (isChair(actor)) return { ev, ok:true };
    if (isDirectorOf(actor, c.prog)) return { ev, ok:true };
    if (ev === "approve" && c.areaHead === actor.netid) return { ev, ok:true };
    if (c.areaHead === actor.netid)
      return { ev, ok:false, why:"An area head signs off on a revision but does not open one" };
    return { ev, ok:false, why:`${c.prog} courses are the ${c.prog} director's to change` };
  });
}

/* The log is Tier 2: any *acting* role. `student` and `advisor` get no history
   section at all — absent, not empty (#28, #40). */
const seesHistory = actor => canAct(actor);

/* Tier 1 vs Tier 2 on the record itself. A `student` may read an offering only
   in `COMMITTED_STATES` (#28) — in a *list* the row is simply absent, but a page
   has a URL, so the page has to say something. #37's rule that a hidden row must
   not announce itself applies here too: the refusal names no state. */
const seesOffering = (actor, o) => canAct(actor) || COMMITTED.includes(o.state);

function logFor(rec) { return LOG[`${rec.kind}:${rec.id}`] ?? []; }

/* ==========================================================================
   Shared fragments
   ========================================================================== */

function chip(p, n, foreign, by, at) {
  const cls = p.toLowerCase();
  const label = foreign ? `${p} · ${n}` : n;
  const grant = foreign && by ? `<span class="grant">granted by ${nameOf(by)}, ${fmtDate(at)}</span>` : "";
  return `<span class="chip ${cls}${foreign ? " foreign" : ""}">${esc(label)}</span>${grant}`;
}

const stateChip = s => `<span class="state ${TONE[s]}">${esc(s)}</span>`;

/* The offering page's link up to its course. Only a live link where this
   prototype actually holds that course — a dead control teaches nothing. */
function courseLink(courseId, text) {
  const key = RECORDS.find(r => r.kind === "course" && r.id === courseId)?.key;
  return key ? `<a href="#" data-open="${key}">${esc(text)}</a>`
             : `<span class="none">${esc(text)} — not in this prototype</span>`;
}

function actionBlock(actions, { primary = true } = {}) {
  if (!actions.length) return `<span class="none">No moves from here.</span>`;
  const allowed = actions.filter(a => a.ok);
  const refused = actions.filter(a => !a.ok);
  const btns = actions.map((a, i) => a.ok
    ? `<button class="vbtn${primary && i === 0 ? " primary" : ""}" type="button">${esc(a.ev)}</button>`
    : `<button class="vbtn" type="button" disabled>${esc(a.ev)}</button>`).join("");
  const why = refused.map(a =>
    `<span class="refusal"><b>${esc(a.ev)}</b><span class="why">${esc(a.why)}</span></span>`).join("");
  const none = allowed.length ? "" :
    `<div class="refusal" style="margin-bottom:8px"><span class="why" style="margin-left:0">Nothing here is yours to do.</span></div>`;
  return `${none}<div class="actbar">${btns}</div>${why ? `<div class="refusals">${why}</div>` : ""}`;
}

/* #61: rows carry their own `position`; the lead is whoever holds 0, and that
   may be nobody while rows sit below. Never `roster[0]`. */
function leadOf(o) { return o.roster.find(r => r.pos === 0)?.netid ?? null; }

const NO_LEAD = `Position 0 is empty, so this section cannot be offered to anyone.`;

function rosterList(o) {
  /* Two distinct empties (#61 splits what #41 shipped as one). Nothing at all,
     and rows below a vacant position 0 — the second is what `decline` and
     `withdraw` leave behind, and it must not read as a staffed section. */
  if (!o.roster.length)
    return `<div class="empty"><b>No instructor yet</b>${NO_LEAD}</div>`;

  const notice = leadOf(o)
    ? ``
    : `<div class="empty" style="margin-bottom:10px"><b>No lead instructor</b>${NO_LEAD} The people below are co-instructors.</div>`;

  const rows = [...o.roster].sort((a, b) => a.pos - b.pos);
  return `${notice}<table><thead><tr><th>Position</th><th>Instructor</th></tr></thead><tbody>${
    rows.map(r => `<tr>
      <td class="num">${r.pos}</td>
      <td>${person(r.netid, { lead: r.pos === 0, pronouns: true })}</td>
    </tr>`).join("")}</tbody></table>`;
}

function meetingsTable(o) {
  if (!o.meetings.length) return `<div class="empty"><b>No meeting pattern</b>Nothing has been scheduled for this section.</div>`;
  return `<table><thead><tr><th>Kind</th><th>When</th><th>Room</th></tr></thead><tbody>${
    o.meetings.map(m => `<tr>
      <td><span class="mono">${esc(m.kind)}</span></td>
      <td>${esc(meetingText(m))}</td>
      <td>${m.room ? esc(m.room) : `<span class="none">—</span>`}</td>
    </tr>`).join("")}</tbody></table>`;
}

function provLine(r) {
  const changed = r.updatedBy
    ? `<span><b>Last changed</b> ${nameOf(r.updatedBy)}, ${fmt(r.updatedAt)}</span>`
    : `<span><b>Last changed</b> never</span>`;
  return `<div class="prov"><span><b>Created</b> ${nameOf(r.createdBy)}, ${fmt(r.createdAt)}</span>${changed}</div>`;
}

/* --- history, three ways ------------------------------------------------- */

/* A: the seven stored columns, verbatim. Nothing is composed. */
function historyTable(rows) {
  return `<div class="tablewrap"><table class="logtable">
    <thead><tr>
      <th>event</th><th>from_state</th><th>to_state</th>
      <th>actor_netid</th><th>subject_netid</th><th>reason</th><th>at</th>
    </tr></thead><tbody>${rows.map(r => `<tr>
      <td class="ev">${esc(r.event)}</td>
      <td class="st">${esc(r.from)}</td>
      <td class="st">${esc(r.to)}</td>
      <td>${named(r.actor)}</td>
      <td>${r.subject ? named(r.subject) : `<span class="none">—</span>`}</td>
      <td class="rsn">${r.reason ? esc(r.reason) : `<span class="none">—</span>`}</td>
      <td class="at">${fmt(r.at)}</td>
    </tr>`).join("")}</tbody></table></div>`;
}

/* B: a sentence per row. Readable, and it invents wording the machine never
   said — including, on `offer` and `accept`, a person it cannot name, because
   #19 gave neither event a `subject_netid`. Those two are flagged here so the
   cost is visible rather than argued about. */
const PHRASE = {
  staff:    r => [`named ${nameOf(r.subject)} as lead instructor`, false],
  unstaff:  r => [`vacated the lead position`, false],
  /* These two used to read "sent the offer out" and "recorded an acceptance"
     with nobody named, because #19 gave neither event a `subject_netid`. That
     is the hole the sentence treatment exposed and this ticket closed: both
     events now carry one, so both lines can name their person. The flagged
     version is one commit back on this branch if you want to see it. */
  offer:    r => [r.subject ? `offered it to ${nameOf(r.subject)}` : `sent the offer out`, !r.subject],
  accept:   r => [r.subject ? `recorded ${nameOf(r.subject)}'s acceptance` : `recorded an acceptance`, !r.subject],
  decline:  r => [`recorded ${nameOf(r.subject)}'s refusal`, false],
  defer:    r => [`recorded a request for more time`, false],
  withdraw: r => [`withdrew the offer to ${nameOf(r.subject)}`, false],
  schedule: r => [`scheduled it`, false],
  publish:  r => [`published it`, false],
  list:     r => [`listed it in the catalog`, false],
  run:      r => [`marked it running`, false],
  evaluate: r => [`sent it to evaluation`, false],
  conclude: r => [`concluded it`, false],
  cancel:   r => [`cancelled the class`, false],
  retry:    r => [`reinstated it`, false],
  kill:     r => [`discarded it`, false],
  revise:   r => [`opened it for revision`, false],
  approve:  r => [`approved the revision`, false],
  retire:   r => [`retired it`, false],
};

function historyTimeline(rows, rec) {
  const first = `<div class="tl derived">
    <div class="dotcol"><span class="dot"></span><span class="stem"></span></div>
    <div><div class="said">${named(rec.createdBy)} created it</div>
      <div class="when">${fmt(rec.createdAt)} · derived from <span class="mono">created_by</span>, not a log row</div></div>
  </div>`;
  const body = rows.map((r, i) => {
    const [said, guessy] = (PHRASE[r.event] ?? (x => [x.event, false]))(r);
    const flag = guessy ? `<span class="flag">no name on this row</span>` : "";
    const quote = r.reason ? ` — <span class="quote">“${esc(r.reason)}”</span>` : "";
    return `<div class="tl">
      <div class="dotcol"><span class="dot ${TONE[r.to]}"></span><span class="stem"></span></div>
      <div>
        <div class="said"><b>${named(r.actor)}</b> ${said}${quote}${flag}</div>
        <div class="when">${fmt(r.at)}</div>
      </div>
    </div>`;
  }).join("");
  return `<div class="timeline">${first}${body}</div>`;
}

/* C: one line per row that reads, with the machine's own values kept visible
   beside it in mono — so nothing is composed that the log did not say. */
function historyFeed(rows, rec, { limit = null } = {}) {
  const shown = limit ? rows.slice(-limit) : rows;
  const hidden = rows.length - shown.length;
  const items = [...shown].reverse().map(r => `<div class="f">
    <div class="l1">
      <span class="who">${named(r.actor)}</span>
      <span class="mv">${esc(r.event)}</span>
      <span class="arrow">${esc(r.from)} → ${esc(r.to)}</span>
    </div>
    ${r.subject ? `<div class="when">on ${nameOf(r.subject)}</div>` : ""}
    ${r.reason ? `<div class="rsn">“${esc(r.reason)}”</div>` : ""}
    <div class="when">${fmt(r.at)}</div>
  </div>`).join("");
  const more = hidden > 0
    ? `<button class="more" type="button" data-feed="all">Show ${hidden} earlier ${hidden === 1 ? "move" : "moves"}</button>`
    : (limit && rows.length > 4 ? "" : "");
  const created = `<div class="f derived">
    <div class="l1"><span class="who">${named(rec.createdBy)} created it</span></div>
    <div class="when">${fmt(rec.createdAt)}</div>
  </div>`;
  return `<div class="feed">${items}${more}${created}</div>`;
}

const emptyHistory = what => `<div class="empty"><b>Nothing has happened to this ${what} yet</b>It was created and has not moved since. Creating is not a transition, so the log has no row for it.</div>`;

/* A page has a URL, so a hidden record has to answer for itself. The wording
   deliberately says nothing about the state it is in — "this section is
   Declined and you may not see it" leaks exactly what hiding it is for. */
function notForYou(o) {
  const c = courseOf(o.course);
  return `<div class="crumbs"><a href="#">Lineup</a><span class="sep">/</span><span>${esc(TERMS[o.term])}</span></div>
    <div class="empty" style="margin-top:22px">
      <b>There is no section here</b>
      ${esc(c.number)} has no section ${esc(o.section)} in ${esc(TERMS[o.term])} that you can see.
      Try the ${esc(TERMS[o.term])} Lineup.
    </div>`;
}

/* ==========================================================================
   The "reached from" strip — how a page is reached, which is question one.
   Each variant offers a different affordance on the same list row.
   ========================================================================== */

function reachStrip(rec) {
  const v = state.variant;
  const how = {
    A: ["A linked identifier", "The number is a link. Clicking the row still expands it — the link is a smaller target inside the bigger one."],
    B: ["An item in the ⋯ menu", "“Open class page” sits above the transitions in the menu #37 already built. No new control on the row."],
    C: ["A dedicated ↗ control", "A separate control at the row's right edge, outside the expand target."],
    D: ["A dedicated ↗ control", "Settled: one click, outside the expand target, impossible to mis-hit. The row click still belongs to #37's grouping."],
  }[v];

  if (rec.kind === "course") {
    const c = courseOf(rec.id);
    return `<div class="reach">
      <header>From the Catalog <em>${esc(how[0])} — ${esc(how[1])}</em></header>
      <div class="rows">
        <div class="grouphead here">
          ${v === "A"
            ? `<button class="openlink" data-open="${rec.key}">${esc(c.number)}</button>`
            : `<span class="mono">${esc(c.number)}</span>`}
          <span class="grow">${esc(c.title)}</span>
          <span class="num">${c.credits} cr</span>
          ${stateChip(c.state)}
          ${v === "B" ? `<span class="mono openlink" data-open="${rec.key}">⋯ 2 ▾ Open course page</span>` : ""}
          ${(v === "C" || v === "D") ? `<button class="openbtn" data-open="${rec.key}" title="Open course page">↗</button>` : ""}
          <span class="expandcue">▾ expands to its program group</span>
        </div>
      </div>
    </div>`;
  }

  const o = offeringOf(rec.id);
  const c = courseOf(o.course);
  /* The list obeys #28's tiers: a section a student may not see is *absent*
     from the group, never greyed. Which is why this strip thins out for
     Marcus — and why the page he lands on has to refuse in its own words. */
  const siblings = OFFERINGS
    .filter(x => x.course === o.course && x.term === o.term)
    .filter(x => seesOffering(state.actor, x));
  return `<div class="reach">
    <header>From the Lineup, ${esc(TERMS[o.term])} <em>${esc(how[0])} — ${esc(how[1])}</em></header>
    <div class="rows">
      <div class="grouphead">
        <span class="mono">${esc(c.number)}</span>
        <span class="grow">${esc(c.title)}</span>
        <span class="expandcue">▾ the group — clicking here expands</span>
      </div>
      ${siblings.map(s => {
        const here = s.id === o.id ? " here" : "";
        const key = RECORDS.find(r => r.kind === "offering" && r.id === s.id)?.key;
        const openable = key ? key : null;
        return `<div class="srow${here}">
          ${v === "A"
            ? (openable ? `<button class="openlink" data-open="${openable}">§${esc(s.section)}</button>`
                        : `<span class="mono">§${esc(s.section)}</span>`)
            : `<span class="mono">§${esc(s.section)}</span>`}
          <span class="grow">${leadOf(s) ? nameOf(leadOf(s)) : `<span class="none">Needs an instructor</span>`}</span>
          ${stateChip(s.state)}
          ${v === "B" ? `<span class="mono ${openable ? "openlink" : "none"}"${openable ? ` data-open="${openable}"` : ""}>⋯ ▾ Open class page</span>` : ""}
          ${(v === "C" || v === "D") && openable ? `<button class="openbtn" data-open="${openable}" title="Open class page">↗</button>` : ""}
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

/* ==========================================================================
   Variant D — the settled page
   Assembled from A, B and C one answer at a time; see the resolution on #41.

     Q1 reached by a dedicated ↗ control at the row's right edge      (C)
     Q2 rail layout — the record on the left, what you may do on the right (C)
     Q3 history as a sentence per row                                 (B)
     Q4 the course's sections grouped by term                        (B, C)
     Q5 history in the main column, at the bottom, full width         (new)
     Q6 the history opens with a derived creation line; the rail's
        provenance box drops to *last changed* alone                  (new)
     Q7 a record you may not see refuses without naming its state     (new)

   The two consequences that fell out of those choices:

   - **`offer` and `accept` gained `subject_netid`**, amending #19. Sentences
     need a name and those two events did not carry one; the roster was #19's
     answer and the roster is present-tense. See PComp §3.
   - **The department-wide activity view is out of scope**, ruled here rather
     than left as fog.
   ========================================================================== */

/* Sentences at full width. The creation line opens it — hollow dot, no
   caption: the dot is what says "not a move", and #13's reason for having no
   genesis row is not something a coordinator needs read to them. */
function historyStory(rows, rec) {
  const created = `<div class="tl derived">
    <div class="dotcol"><span class="dot"></span><span class="stem"></span></div>
    <div>
      <div class="said">${named(rec.createdBy)} created it</div>
      <div class="when">${fmt(rec.createdAt)}</div>
    </div>
  </div>`;
  const body = rows.map(r => {
    const [said] = (PHRASE[r.event] ?? (x => [x.event]))(r);
    const quote = r.reason ? ` — <span class="quote">“${esc(r.reason)}”</span>` : "";
    return `<div class="tl">
      <div class="dotcol"><span class="dot ${TONE[r.to]}"></span><span class="stem"></span></div>
      <div>
        <div class="said"><b>${named(r.actor)}</b> ${said}${quote}</div>
        <div class="when">${fmt(r.at)}</div>
      </div>
    </div>`;
  }).join("");
  return `<div class="timeline">${created}${body}</div>`;
}

function historySection(rows, rec, what, actor) {
  if (!seesHistory(actor)) return "";
  return `<div class="sect">
    <h2>History <span class="n">${rows.length ? `${rows.length} move${rows.length === 1 ? "" : "s"}` : "no moves yet"}</span></h2>
    ${historyStory(rows, rec)}
  </div>`;
}

/* Created is now the history's first line, so this box carries changes alone —
   the trace of the field writes #17 left the log forbidden to record. */
function railChanged(r) {
  return `<div class="railbox">
    <h3>Last changed</h3>
    ${r.updatedBy
      ? `<div class="feed"><div class="f"><div class="l1"><span class="who">${named(r.updatedBy)}</span></div><div class="when">${fmt(r.updatedAt)}</div></div></div>`
      : `<span class="none">Never changed since it was created.</span>`}
  </div>`;
}

function railStatus(chipHtml, actionsHtml) {
  return `<div class="railbox">
    <h3>Status</h3>
    <div style="margin-bottom:12px">${chipHtml}</div>
    ${actionsHtml}
  </div>`;
}

function sectionsByTerm(offs) {
  if (!offs.length) return `<div class="empty"><b>This course has never been offered</b>No section of it exists in any term.</div>`;
  const byTerm = {};
  offs.forEach(o => (byTerm[o.term] ??= []).push(o));
  return Object.keys(byTerm).sort().reverse().map(t => `<div class="termgroup">
    <header>${esc(TERMS[t])}<span class="n">${byTerm[t].length} section${byTerm[t].length > 1 ? "s" : ""}</span></header>
    <table><tbody>${byTerm[t].map(o => {
      const key = RECORDS.find(r => r.kind === "offering" && r.id === o.id)?.key;
      return `<tr>
        <td class="num" style="width:56px">§${esc(o.section)}</td>
        <td style="width:110px">${stateChip(o.state)}</td>
        <td>${leadOf(o) ? person(leadOf(o)) : `<span class="none">Needs an instructor</span>`}</td>
        <td>${o.meetings.map(m => esc(meetingText(m))).join("<br>")}</td>
        <td style="width:34px" class="rt">${key ? `<button class="openbtn" data-open="${key}" title="Open class page">↗</button>` : ""}</td>
      </tr>`;
    }).join("")}</tbody></table>
  </div>`).join("");
}

function courseD(c, rec, actor) {
  const rows = logFor(rec);
  const offs = offeringsOfCourse(c.id);
  const marker = notOfferable(c);
  const terms = new Set(offs.map(o => o.term)).size;
  return `
  <div class="crumbs"><a href="#">Catalog</a><span class="sep">/</span><span>${esc(c.number)}</span></div>
  <div class="c-grid">
    <div>
      <div class="c-head">
        <div class="number">${esc(c.number)}</div>
        <h1>${esc(c.title)}</h1>
        <div style="display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-top:9px">
          <span class="chip ${c.prog.toLowerCase()}">${esc(c.prog)}</span>
          <span>${c.credits} credits</span>
          <span>Edition ${c.edition}</span>
          ${marker ? `<span class="warn">${esc(marker)}</span>` : ""}
        </div>
      </div>

      ${c.description ? `<div class="sect"><h2>Description</h2><p style="max-width:66ch;margin:0">${esc(c.description)}</p></div>` : ""}

      <div class="sect">
        <h2>Where it sits</h2>
        <dl class="facts">
          <dt>Areas</dt><dd>${c.areas.length ? `<div class="chips">${c.areas.map(a => chip(a.p, a.n, false)).join("")}</div>` : `<span class="none">Not yet assigned</span>`}</dd>
          <dt>Requirements</dt><dd>${c.cats.length ? `<div class="chips">${c.cats.map(a => chip(a.p, a.n, false)).join("")}</div>` : `<span class="none">None</span>`}</dd>
          <dt>Area head</dt><dd>${c.areaHead ? person(c.areaHead, { pronouns: true }) : `<span class="none">Not yet assigned</span>`}</dd>
          <dt>Link</dt><dd>${c.url ? `<a href="${esc(c.url)}">${esc(c.url)}</a>` : `<span class="none">None</span>`}</dd>
        </dl>
      </div>

      <div class="sect">
        <h2>Sections <span class="n">${offs.length ? `${offs.length} across ${terms} term${terms === 1 ? "" : "s"}` : "none"}</span></h2>
        ${sectionsByTerm(offs)}
      </div>

      ${historySection(rows, c, "course", actor)}
    </div>

    <aside class="c-rail">
      ${railStatus(stateChip(c.state), canAct(actor) ? actionBlock(courseActions(actor, c)) : "")}
      ${railChanged(c)}

  </div>`;

function offeringD(o, rec, actor) {
  const c = courseOf(o.course);
  const rows = logFor(rec);
  return `

      <div class="sect"><h2>Meets <span class="n">${o.meetings.length} slot${o.meetings.length === 1 ? "" : "s"}</span></h2>${meetingsTable(o)}</div>

      <div class="sect">
        <h2>The section</h2>
        <dl class="facts">
          <dt>Enrollment limit</dt><dd>${o.cap ?? `<span class="none">Not set</span>`}</dd>
          <dt>Mode</dt><dd>${o.mode ? esc(o.mode) : `<span class="none">Not set</span>`}</dd>
          <dt>Call number</dt><dd>${o.call ? `<span class="mono">${esc(o.call)}</span>` : `<span class="none">Not assigned</span>`}</dd>
          <dt>SIS class number</dt><dd>${o.sis ? `<span class="mono">${o.sis}</span>` : `<span class="none">Not assigned</span>`}</dd>
          <dt>Link</dt><dd>${o.url ? `<a href="${esc(o.url)}">${esc(o.url)}</a>` : `<span class="none">None</span>`}</dd>
        </dl>
      </div>

      <div class="sect">
        <h2>Seats shared</h2>
        ${(o.foreignAreas.length || o.foreignCats.length)
          ? [...o.foreignAreas, ...o.foreignCats].map(t => `<div style="margin-bottom:6px">${chip(t.p, t.n, true, t.by, t.at)}</div>`).join("")
          : `<span class="none">Not shared with another program.</span>`}
      </div>

      ${historySection(rows, o, "section", actor)}

      ${railChanged(o)}
    </aside>
  </div>`;
}

/* ==========================================================================
   Wiring
   ========================================================================== */

const state = { variant: "A", record: "c1", actor: ACTORS[0], tab: "details", feedFull: false };

const VARIANTS = [
  { key:"D", name:"Settled — the shape assembled from A, B and C" },
  { key:"A", name:"Dossier — one column, raw log table" },
  { key:"B", name:"Record — header card, tabs, sentences" },
  { key:"C", name:"Rail — main column plus a status rail" },
];
let vi = 0;   // open on the settled shape

const RENDER = {
  D: { course: courseD, offering: offeringD },
  A: { course: courseA, offering: offeringA },
  B: { course: courseB, offering: offeringB },
  C: { course: courseC, offering: offeringC },
};

function currentRecord() { return RECORDS.find(r => r.key === state.record) ?? RECORDS[0]; }

function render() {
  const rec = currentRecord();
  const v = VARIANTS[vi];
  state.variant = v.key;

  document.getElementById("vkey").textContent = v.key;
  document.getElementById("vname").textContent = v.name;
  document.getElementById("note").textContent = rec.note;
  document.getElementById("nav-catalog").className = rec.kind === "course" ? "on" : "";
  document.getElementById("nav-lineup").className = rec.kind === "offering" ? "on" : "";

  const entity = rec.kind === "course" ? courseOf(rec.id) : offeringOf(rec.id);
  const page = (rec.kind === "offering" && !seesOffering(state.actor, entity))
    ? notForYou(entity)
    : RENDER[v.key][rec.kind](entity, rec, state.actor);

  document.getElementById("view").innerHTML = reachStrip(rec) + page;
}

/* --- controls ----------------------------------------------------------- */

const actorSel = document.getElementById("actor");
ACTORS.forEach((a, i) => {
  const o = document.createElement("option");
  o.value = String(i); o.textContent = a.label;
  actorSel.appendChild(o);
});
actorSel.addEventListener("change", e => { state.actor = ACTORS[+e.target.value]; render(); });

const recSel = document.getElementById("record");
RECORDS.forEach(r => {
  const o = document.createElement("option");
  o.value = r.key; o.textContent = r.label;
  recSel.appendChild(o);
});
recSel.addEventListener("change", e => { state.record = e.target.value; state.tab = "details"; state.feedFull = false; render(); });

document.getElementById("view").addEventListener("click", e => {
  const open = e.target.closest("[data-open]");
  if (open) {
    e.preventDefault();
    state.record = open.dataset.open;
    state.tab = "details"; state.feedFull = false;
    recSel.value = state.record;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  const tab = e.target.closest("[data-tab]");
  if (tab) { state.tab = tab.dataset.tab; render(); return; }
  if (e.target.closest("[data-feed]")) { state.feedFull = true; render(); }
});

function step(d) {
  vi = (vi + d + VARIANTS.length) % VARIANTS.length;
  const u = new URL(location);
  u.searchParams.set("variant", VARIANTS[vi].key);
  history.replaceState(null, "", u);
  render();
}
document.getElementById("prev").addEventListener("click", () => step(-1));
document.getElementById("next").addEventListener("click", () => step(1));
document.addEventListener("keydown", e => {
  if (e.target.matches("select, input")) return;
  if (e.key === "ArrowLeft")  step(-1);
  if (e.key === "ArrowRight") step(1);
});

const start = new URL(location).searchParams.get("variant");
if (start) {
  const i = VARIANTS.findIndex(v => v.key === start.toUpperCase());
  if (i >= 0) vi = i;
}
render();
</script>
