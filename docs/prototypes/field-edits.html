<title>Where a field edit happens — four variants, B settled</title>

<!--
  PROTOTYPE — throwaway. Answers issue #62, "Where does a field edit happen, and
  what shape is it?"

  Seven field classes have had a writer, a state rule and a column list since #8
  and #10, and **no control anywhere in the skeleton**. Four screen tickets — #37
  the list views, #38 the roles page, #41 the detail pages, #42 the review page,
  #43 the create forms — each settled what a page *displays* or what a form
  *asks*, and none of them was about what a page lets you *change*. This file is
  four structurally different answers, switchable with the floating bar or the
  ← → keys.

    B — SETTLED       the rail gains `Edit`, opening one full page per record
                      that asks everything you may change at once — #43's shape
                      for creation, applied to editing. Won outright, the second
                      of five prototyped tickets to do so. A, C and D are kept
                      beside it as the primary source it was chosen against.
    A — In place      the value is the control; click it, change it, it saves.
                      No route, no form, no Save button for the page.
    C — Section by section  every section of the record carries its own Edit,
                      opening a small full page for that field class alone.
                      One page = one writer = one state rule.
    D — In the rail    the record keeps no controls at all; the rail lists the
                      changes you may make beneath the transitions you may fire,
                      refused the same way, opening C's pages.

  A and D are the poles of the ticket's first question — *the rail holds what you
  may do, and an edit is arguably one of those*. B and C are the poles of its
  second — *field-at-a-time or a form*, and if a form, how big.

  ---------------------------------------------------------------------------
  What is already settled, and is not re-decided here
  ---------------------------------------------------------------------------

  · The pages exist and their shape is fixed — a record on the left, a sticky
    rail of permitted actions with refusals stated beneath, history in sentences
    at the bottom (#41, inherited by #42).
  · Refusals are stated in the open, never greyed and never silent (#40) — and
    read-only means controls *and* refusals **absent**, not disabled (#38).
    So a `student` sees no controls and no refusals in any variant.
  · Full pages beat drawers and modals (#40, #43). Nothing here opens a modal.
  · A field write fires no transition and writes **no log row** (#17).
    `updated_at` / `updated_by` are the only trace — which is why every variant
    is wired to actually mutate, so you can watch the rail's *last changed* move
    and the history below it stay exactly as long as it was.
  · The check lives inside the single field writer, state predicate and role
    predicate ANDed and **checked separately** (#28).
  · The chair is one OR-clause ahead of the permission check (#34), rendered
    here exactly as `course-offering-detail.html` renders it for transitions.
  · Position 0 of a roster is **not a field class** — renumbering into 0 is
    `staff`, through the machine or not at all (#15, #61). Every variant refuses
    it; none of them offers it.

  ---------------------------------------------------------------------------
  The seven classes, and where they surface
  ---------------------------------------------------------------------------

    Course page    Course body          gated to `Revising`
                   Course assignment    state-blind
    Class page     Offering operational state-blind, `Concluded` included
                   Seat-sharing tags    state-blind, writer is the *category's*
                                        director — the map's one scope exception
                   Roster, positions 1..n   state-blind, every state
    Review page    Proposal body        gated to `Developing`
                   Review assignment    gated to `Proposed` / `Developing`

  Three of the seven are **not columns**. `course_area`, `offering_meeting`,
  `offering_area`, `offering_requirement_category` and `offering_instructor` are
  rows, and adding or removing a row is not the same interaction as editing a
  value. Two classes are *mixed* — Course assignment is one column plus rows,
  Offering operational is six columns plus rows — which is the case that makes
  "a field edit" the wrong unit and the field class the right one.

  ---------------------------------------------------------------------------
  What each variant does about the five open questions
  ---------------------------------------------------------------------------

                        | B Edit page     | A In place      | C Section      | D Rail
    entry point         | the rail        | the value       | the section    | the rail
    a save commits      | the record      | one field       | one class      | one class
    a state gate refuses| in the form     | under the field | on the header  | in the rail
    rows add/remove     | sub-table       | in place, ×     | its own page   | its own page
    `Concluded` reads   | with a caution  | no different    | with a caution | no different

  `Concluded` was built split down the middle rather than answered — open
  Physical Computing §1, Spring 2025 in each variant. #8 put `Concluded` inside
  the operational class on purpose and #17's worked example was *"wrong
  instructor credited"*, so the question was never whether the edit is allowed
  but whether the screen should say anything about it. Settling B settles that
  too: **it is stated**.

  ---------------------------------------------------------------------------
  What settling B changed in this file
  ---------------------------------------------------------------------------

  Two repairs, both cases B alone did not survive:

  · **The `Concluded` caution is keyed on the record, not on the class.** It
    first fired only when the operational class was the one open to you, which
    is wrong under B: every class on a class page is state-blind, so a director
    editing nothing but the roster is still correcting a finished term.

  · **The review edit page states whose body it is about to rewrite.** B commits
    one Save across every class open to you, and on a review one of those tables
    is the *proposal's* — shared with every other programme reviewing it. C
    carried that caution because its pages are one class wide and the body has
    its own; B has to carry it on the one page or the shared write is silent.

  ---------------------------------------------------------------------------
  Two things this file made visible that were hard to see on paper
  ---------------------------------------------------------------------------

  1. **Two predicates fail independently, so a refusal is sometimes two
     sentences.** #28 ruled the state and role predicates are ANDed and checked
     separately, and every variant here hits the case where both fail at once:
     view Physical Computing (Approved) as Amina Bello, IMA's director, and the
     body is refused *both* because she is not its director and because the
     course is not `Revising`. Stating one hides a wall the reader will walk
     into next. Stating both is the only honest rendering and it is bulkier than
     any transition refusal in #41, because a transition has one gate and a
     field class has two.

  2. **Seat-sharing inverts who the refusal names, and it is the only class
     that does.** #25 and #30 left exactly one exception standing: the writer of
     a foreign tag is the director of the **category's** programme, not the
     offering's. So on Physical Computing §1 — an ITP class — Priya Raman, ITP's
     own director, may not touch the IMA tag, and Amina Bello, who has no other
     business on the page, may. Every other refusal on these pages points at the
     record's own programme; this one points away from it, and a reader with no
     way to know that reads it as a bug.

  The "Viewing as" control is a prototype device for looking at what varies by
  role, not part of the page.

  ---------------------------------------------------------------------------
  AMENDED by #65, "Do program_director and area_head hold flat routes on
  proposal creation and body edits?"
  ---------------------------------------------------------------------------

  **The Proposal body class has three writers, not one.** This file was built on
  `course_proposal.created_by` alone; #65 restored #8's row — `created_by`, a
  director of any requested programme, or the review's `area_head`, while at
  least one review is `Developing`. So a review edit page opened by a director
  whose own review is `Developing` gains a Proposal body section it does not
  show here.

  **No page needs redrawing by hand**, and #62's decision survives: B renders
  only the field classes open to you, so the page is a function of
  `FIELD_CLASSES` and follows by its own stated rule. **One of #62's reasons
  narrows** — it held that the one-page shape "earns nothing on the review page"
  because the body's writer and the review assignment's writer coincide "only
  when a director proposes", and under #65 they coincide whenever that review is
  `Developing`. The shape is still kept for consistency with the other two
  pages; the argument for it is now weaker than #62 wrote it. See README.md.

  Not a data layer, not a framework, no persistence — a static approximation of
  Next.js + Mantine, built to be reacted to, not to be promoted. The cast is
  continuous with catalog-lineup-views.html, roles-page.html,
  course-offering-detail.html, proposals-review.html and create-forms.html, and
  adds two people: a coordinator who is not also a director (so the operational
  class's *coordinator or the offering's director* has something to say), and a
  proposer who is not a director (so the proposal body's `created_by` does).
-->

/* ==========================================================================
   Read model — assembled the way `getCoursePage` / `getOfferingPage` /
   `getReviewPage` would assemble it server-side (#9), plus the in-memory
   overrides this prototype writes so an edit can actually be watched to land.
   ========================================================================== */

const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

const courseOf   = id => COURSES.find(c => c.id === id);
const offeringOf = id => OFFERINGS.find(o => o.id === id);
const reviewOf   = id => REVIEWS.find(r => r.id === id);
const proposalOf = id => PROPOSALS.find(p => p.id === id);

/* The record a page is about, plus the programme it is scoped to. */
function load(rec) {
  if (rec.kind === "course")   { const c = courseOf(rec.id);   return { ...c, prog: c.prog }; }
  if (rec.kind === "offering") { const o = offeringOf(rec.id); return { ...o, prog: courseOf(o.course).prog }; }
  const r = reviewOf(rec.id);  return { ...r, proposalRow: proposalOf(r.proposal) };
}
const raw = rec => rec.kind === "course" ? courseOf(rec.id)
                 : rec.kind === "offering" ? offeringOf(rec.id)
                 : reviewOf(rec.id);

const isDirectorOf = (a, p) => a.roles.includes("program_director") && a.programs.includes(p);

/* --- the permission answer, assembled the way #28's writer assembles it --- */

function verdict(fc, actor) {
  /* The chair is one OR-clause ahead of the permission check and of nothing
     else (#34) — never the state gate, which is an invariant. */
  const roleOk = isChair(actor) || fc.role(actor);
  const gateOk = fc.gate;
  return {
    ok: roleOk && gateOk,
    roleOk, gateOk,
    /* #38: someone holding no acting role sees no controls **and no refusals**. */
    speak: canAct(actor),
  };
}

/* ==========================================================================
   Mutation — in memory only. Every variant writes through here so that the
   thing #17 left behind is visible: `updated_at` / `updated_by` move, and the
   history below the fold does not grow by a line.
   ========================================================================== */

function touch(rec, actorNetid, target) {
  const row = target ?? raw(rec);
  row.updatedBy = actorNetid;
  row.updatedAt = nowStamp();
  LAST_WRITE = { key: rec.key, at: Date.now() };
}
function nowStamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
let LAST_WRITE = null;

/* Where a field's value actually lives — the proposal body sits on the shared
   `course_proposal` row while everything else sits on the record itself. */
function holder(rec, fc) {
  const r = raw(rec);
  if (rec.kind === "review" && fc.shared) return proposalOf(r.proposal);
  return r;
}

function setField(rec, fc, key, value) {
  const row = holder(rec, fc);
  row[key] = value;
  touch(rec, ACTOR().netid, row);
}
function addRow(rec, fc, value) {
  const row = holder(rec, fc);
  const rd = fc.rows;
  if (rd.key === "foreign") row.foreignAreas.push({ ...value, by: ACTOR().netid, at: nowStamp() });
  else if (rd.key === "roster") {
    const next = Math.max(0, ...row.roster.map(r => r.pos)) + 1;
    row.roster.push({ pos: Math.max(next, 1), netid: value.netid, by: ACTOR().netid, at: nowStamp() });
  }
  else row[rd.key].push(value);
  touch(rec, ACTOR().netid, row);
}
function removeRow(rec, fc, idx) {
  const row = holder(rec, fc);
  const rd = fc.rows;
  const list = rd.get();
  const victim = list[idx];
  if (rd.key === "foreign") {
    const pool = victim.kind === "area" ? row.foreignAreas : row.foreignCats;
    pool.splice(pool.findIndex(t => t.p === victim.p && t.n === victim.n), 1);
  } else if (rd.key === "roster") {
    row.roster.splice(row.roster.findIndex(r => r.pos === victim.pos), 1);
  } else {
    row[rd.key].splice(row[rd.key].indexOf(victim), 1);
  }
  touch(rec, ACTOR().netid, row);
}

   Shared fragments
   ========================================================================== */

/* Transitions — copied unchanged from #41's prototype so the rail is the rail
   the ticket settled, and an edit control can be judged beside it. */
const OFFERING_EVENTS = {
  Slated:["staff","kill"], Staffed:["offer","unstaff","kill"],
  Offered:["accept","decline","withdraw","defer"], Deferred:["accept","decline","withdraw"],
  Accepted:["schedule","decline","cancel"], Declined:["retry","kill"],
  Scheduled:["publish","decline","cancel"], Published:["list","decline","cancel"],
  Listed:["run","cancel"], Running:["evaluate","cancel"],
  Evaluating:["conclude"], Canceled:["retry","kill"], Concluded:[], Dead:[],
};
const LEAD_ONLY = ["accept","decline","defer"];
const leadOf = o => o.roster.find(r => r.pos === 0)?.netid ?? null;

function offeringActions(actor, o) {
  const c = courseOf(o.course);
  const lead = leadOf(o);
  return (OFFERING_EVENTS[o.state] ?? []).map(ev => {
    if (LEAD_ONLY.includes(ev)) {
      if (lead === actor.netid) return { ev, ok:true };
      if (!lead) return { ev, ok:false, why:"No lead instructor to answer for this section" };
      return { ev, ok:false, why:`Only ${nameOf(lead)}, the lead instructor, can ${ev} this` };
    }
    if (isChair(actor)) return { ev, ok:true };
    if (isDirectorOf(actor, c.prog) || isCoordinator(actor)) return { ev, ok:true };
    return { ev, ok:false, why:`${PROGRAMS[c.prog]} sections are ${PROGRAMS[c.prog]}'s director's to move` };
  });
}
function courseActions(actor, c) {
  const evs = c.state === "Revising" ? ["approve","retire"]
            : c.state === "Retired"  ? [] : ["revise","retire"];
  const live = OFFERINGS.filter(o => o.course === c.id &&
    ["Slated","Staffed","Offered","Accepted","Deferred","Scheduled","Published","Listed","Running"].includes(o.state));
  return evs.map(ev => {
    if (ev === "retire" && live.length) {
      const list = live.map(o => `§${o.section} ${TERMS[o.term]}`).join(", ");
      return { ev, ok:false, why:`${live.length} section${live.length > 1 ? "s are" : " is"} still live — ${list}` };
    }
    if (isChair(actor)) return { ev, ok:true };
    if (isDirectorOf(actor, c.prog)) return { ev, ok:true };
    if (ev === "approve" && c.areaHead === actor.netid) return { ev, ok:true };
    return { ev, ok:false, why:`${PROGRAMS[c.prog]} courses are ${PROGRAMS[c.prog]}'s director's to change` };
  });
}
function reviewActions(actor, r) {
  const evs = r.state === "Proposed" ? ["approve","reject","develop"]
            : r.state === "Developing" ? ["approve","reject"] : [];
  return evs.map(ev => {
    if (isChair(actor)) return { ev, ok:true };
    if (isDirectorOf(actor, r.prog) || r.areaHead === actor.netid) return { ev, ok:true };
    return { ev, ok:false, why:`${PROGRAMS[r.prog]}'s verdict is ${PROGRAMS[r.prog]}'s to give` };
  });
}

function actionsFor(rec, actor, r) {
  if (rec.kind === "course")   return courseActions(actor, r);
  if (rec.kind === "offering") return offeringActions(actor, r);
  return reviewActions(actor, r);
}

function actionBlock(actions) {
  if (!actions.length) return `<span class="none">No moves from here.</span>`;
  const btns = actions.map((a, i) => a.ok
    ? `<button class="vbtn${i === 0 ? " primary" : ""}" type="button">${esc(a.ev)}</button>` : "").join("");
  const why = actions.filter(a => !a.ok).map(a =>
    `<span class="refusal"><b>${esc(a.ev)}</b> — ${esc(a.why)}</span>`).join("");
  const none = btns ? "" : `<div class="refusal" style="margin-bottom:8px;border:0;padding-left:0">Nothing here is yours to fire.</div>`;
  return `${none}${btns ? `<div class="actbar">${btns}</div>` : ""}${why ? `<div class="refusals">${why}</div>` : ""}`;
}

/* A refusal block for a field class. Both predicates are reported when both
   fail, because #28 checks them separately and a reader who is told only one
   walks into the other. */
function refusalBlock(fc, v) {
  if (!v.speak || v.ok) return "";
  const out = [];
  if (!v.roleOk) out.push(`<span class="refusal"><span class="lede">Not yours</span>${fc.roleWhy}</span>`);
  if (!v.gateOk) out.push(`<span class="refusal"><span class="lede">Not now</span>${fc.gateWhy}${
    fc.gatePointer ? ` <span style="color:var(--ink-faint)">${esc(fc.gatePointer)}</span>` : ""}</span>`);
  return `<div class="refusals">${out.join("")}</div>`;
}

/* --- reading a value ---------------------------------------------------- */

function valueOf(rec, fc, f) {
  const row = holder(rec, fc);
  return row[f.k];
}
function renderValue(rec, fc, f) {
  const raw = valueOf(rec, fc, f);
  if (raw === null || raw === undefined || raw === "")
    return `<span class="none">${esc(f.empty ?? "Not set")}</span>`;
  if (f.type === "person") return person(raw, { pronouns: true });
  if (f.type === "textarea") return `<div class="desc">${esc(raw)}</div>`;
  const cls = [f.mono ? "mono" : "", f.type === "number" ? "num" : ""].filter(Boolean).join(" ");
  return cls ? `<span class="${cls}">${esc(raw)}</span>` : esc(raw);
}

/* --- history (sentences, #41) ------------------------------------------- */

const SAID = {
  staff:"seated the lead instructor", unstaff:"vacated the lead instructor's seat",
  offer:"offered the section to", accept:"accepted the section", decline:"declined the section",
  defer:"asked for more time", withdraw:"withdrew the offer to", schedule:"scheduled it",
  publish:"published it", list:"listed it", run:"started it running", evaluate:"sent it to evaluation",
  conclude:"concluded it", cancel:"cancelled it", retry:"put it back in play", kill:"killed the record",
  revise:"opened it for revision", approve:"approved it", retire:"retired it",
  reject:"rejected it", develop:"sent it back for development",
};
function sentence(r) {
  const verb = SAID[r.event] ?? r.event;
  const obj = ["offer","withdraw"].includes(r.event) && r.subject ? ` ${nameOf(r.subject)}` : "";
  const who = ["staff"].includes(r.event) && r.subject ? `, ${nameOf(r.subject)},` : "";
  return `<b>${nameOf(r.actor)}</b> ${esc(verb)}${who}${esc(obj)}`;
}
function history(rec, r) {
  const rows = LOG[`${rec.kind}:${rec.id}`] ?? [];
  const first = `<div class="tl">
    <div class="dotcol"><span class="dot hollow"></span><span class="stem"></span></div>
    <div><div class="said">${named(r.createdBy)} created it</div>
    <div class="when">${fmt(r.createdAt)}</div></div></div>`;
  const body = rows.map(x => `<div class="tl">
    <div class="dotcol"><span class="dot ${TONE[x.to] ?? "idle"}"></span><span class="stem"></span></div>
    <div><div class="said">${sentence(x)}${x.reason ? ` — <span class="quote">“${esc(x.reason)}”</span>` : ""}</div>
    <div class="when">${fmt(x.at)}</div></div></div>`).join("");
  const note = LAST_WRITE && LAST_WRITE.key === rec.key
    ? `<div class="logfoot">You just changed a field, and this list is exactly as long as it was.
       #17 deleted the transition a field write used to fire, so <b>${esc(rows.length)}</b> rows is what
       the log holds and what it will keep holding. The rail's <i>last changed</i> is the whole trace.</div>`
    : `<div class="logfoot">Field writes never appear here (#17). Only transitions do.</div>`;
  return `<div class="card"><h2>History</h2><div class="body">${first}${body}${note}</div></div>`;
}

/* ==========================================================================
   Rail
   ========================================================================== */

function rail(rec, r, actor, { edits = null, editing = null } = {}) {
  if (editing) {
    return `<div class="rail">
      <div class="sec"><h3>Editing</h3>
        <div style="font-size:13.5px;margin-bottom:11px">${esc(editing.title)}</div>
        <div class="savebar">
          <button class="vbtn primary plain" data-act="save">Save changes</button>
          <button class="vbtn plain" data-act="cancel">Cancel</button>
        </div>
      </div>
      ${editing.locked ? `<div class="sec"><h3>Not yours to change here</h3>${editing.locked}</div>` : ""}
      <div class="sec"><h3>Trace</h3>
        <div class="prov">Saving sets <b>updated_by</b> and <b>updated_at</b> and writes no log row (#17).</div>
      </div>
    </div>`;
  }
  const acts = actionsFor(rec, actor, r);
  const showActions = canAct(actor);
  const prov = `<div class="prov"><b>Created</b> ${nameOf(r.createdBy)}, ${fmt(r.createdAt)}</div>` +
    (r.updatedBy ? `<div class="prov" style="margin-top:4px"><b>Last changed</b> ${nameOf(r.updatedBy)}, ${fmt(r.updatedAt)}</div>` : "");
  return `<div class="rail">
    <div class="sec"><h3>Status</h3>${stateChip(r.state)}</div>
    ${showActions ? `<div class="sec"><h3>What you may do</h3>${actionBlock(acts)}</div>` : ""}
    ${edits ?? ""}
    <div class="sec"><h3>Provenance</h3>${prov}</div>
  </div>`;
}

/* ==========================================================================
   Record header
   ========================================================================== */

function header(rec, r) {
  if (rec.kind === "course") return `<div class="hdr">
    <div class="kicker">Course · ${esc(PROGRAMS[r.prog])}</div>
    <h1>${esc(r.title)}</h1>
    <div class="sub"><span class="mono">${esc(r.number)}</span><span>·</span><span>${esc(r.credits)} credits</span>
    <span>·</span><span>edition ${esc(r.edition)}</span></div></div>`;
  if (rec.kind === "offering") {
    const c = courseOf(r.course);
    return `<div class="hdr">
      <div class="kicker">Class · ${esc(PROGRAMS[r.prog])} · ${esc(TERMS[r.term])}</div>
      <h1>${esc(c.title)} <span style="color:var(--ink-faint);font-weight:400">§${esc(r.section)}</span></h1>
      <div class="sub"><span class="mono">${esc(c.number)}</span><span>·</span><span>${esc(c.credits)} credits</span></div></div>`;
  }
  const p = r.proposalRow;
  return `<div class="hdr">
    <div class="kicker">Proposal review · ${esc(PROGRAMS[r.prog])}</div>
    <h1>${esc(p.title)}</h1>
    <div class="sub"><span>Proposed by ${nameOf(p.createdBy)}</span><span>·</span>
    <span>${esc(p.credits)} credits</span><span>·</span>
    <span>${REVIEWS.filter(x => x.proposal === p.id).length} programmes reviewing</span></div></div>`;
}

/* ==========================================================================
   VARIANT A — In place
   The value is the control. No route, no form, no page-level Save.
   ========================================================================== */

let OPEN_FIELD = null;   // "classKey:fieldKey" currently being edited in place
let OPEN_ADD   = null;   // "classKey" whose add-a-row line is open

function variantA(rec, r, actor) {
  const cards = classesFor(rec, r).map(fc => {
    const v = verdict(fc, actor);
    const rows = [];
    for (const f of fc.fields) {
      const editing = OPEN_FIELD === `${fc.key}:${f.k}`;
      const val = editing ? inlineEditor(rec, fc, f) : `
        <div class="vrow">
          ${v.ok ? `<button class="pencil" data-open="${fc.key}:${f.k}" title="Change this" aria-label="Change ${esc(f.label)}">✎</button>` : ""}
      rows.push(`<div class="k">${esc(f.label)}</div><div class="v">${val}</div>`);
    }
    const body = [
      fc.fields.length ? `<div class="fields">${rows.join("")}</div>` : "",
      fc.rows ? rowBlock(rec, fc, v, { inline: true }) : "",
      refusalBlock(fc, v),
    ].filter(Boolean).join("");
    return card(fc, body, { showClass: true });
  }).join("");
  return page(rec, r, actor, cards, rail(rec, r, actor));
}

function inlineEditor(rec, fc, f) {
  const val = valueOf(rec, fc, f) ?? "";
  const id = `${fc.key}:${f.k}`;
  let input;
  if (f.type === "textarea") input = `<textarea class="txt" data-in="${id}">${esc(val)}</textarea>`;
  else if (f.type === "select") input = `<select class="txt" data-in="${id}">${
    f.options().map(o => `<option${o === val ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  else if (f.type === "person") input = `<select class="txt" data-in="${id}">
    <option value="">— nobody —</option>${
    f.options().map(n => `<option value="${esc(n)}"${n === val ? " selected" : ""}>${esc(nameOf(n))}</option>`).join("")}</select>`;
  else input = `<input class="txt${f.type === "number" ? " short" : ""}" type="${f.type === "number" ? "number" : "text"}" value="${esc(val)}" data-in="${id}">`;
  return `<div class="editbox">${input}
    <div class="row">
      <button class="vbtn primary plain" data-save="${id}">Save</button>
      <button class="vbtn plain" data-cancel="1">Cancel</button>
    </div></div>`;
}

/* ==========================================================================
   Row collections — shared by every variant, because rows are the same
   interaction wherever they are reached from: a list you add to and take from.
   ========================================================================== */

function rowBlock(rec, fc, v, { inline = false, editable = null } = {}) {
  const rd = fc.rows;
  const list = rd.get();
  const may = editable === null ? v.ok : editable;
  const adding = OPEN_ADD === fc.key;

  const head = fc.fields.length
    ? `<div style="margin-top:16px;margin-bottom:8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:700">
        ${esc(rd.title)} <span class="mono" style="font-weight:400;text-transform:none;letter-spacing:0">${esc(rd.table)}</span></div>` : "";

  if (!list.length && !adding)
    return `${head}<div class="empty"><b>${esc(rd.title)}</b>${esc(rd.empty)}</div>${may ? addLine(fc, rd) : ""}`;

  const body = list.map((row, i) => {
    const fixed = rd.fixed?.(row);
    const cells = rd.cells(row).map(c => `<td>${c}</td>`).join("");
    const act = !may ? "" : fixed
      ? `<td class="act"><span class="none" style="font-size:12px">not a field</span></td>`
      : `<td class="act"><button class="x" data-del="${fc.key}:${i}" title="Remove" aria-label="Remove row">×</button></td>`;
  }).join("");

  const fixedNote = may && list.some(row => rd.fixed?.(row))
    ? `<div class="refusal" style="margin-top:9px"><b>Position 0</b> — ${esc(rd.fixedWhy)}</div>` : "";

  return `${head}<table class="rows">
    <thead><tr>${rd.cols.map(c => `<th>${esc(c)}</th>`).join("")}${may ? "<th></th>" : ""}</tr></thead>
    <tbody>${body}</tbody></table>${fixedNote}${may ? (adding ? addPicker(fc, rd) : addLine(fc, rd)) : ""}`;
}

function addLine(fc, rd) {
  return `<div class="addline"><button class="vbtn" data-add="${fc.key}">+ ${esc(rd.addLabel)}</button></div>`;
}
function addPicker(fc, rd) {
  const opts = rd.options();
  if (!opts.length)
    return `<div class="addline"><span class="none">Nothing left to add.</span>
      <button class="vbtn plain" data-cancel="1" style="margin-left:8px">Cancel</button></div>`;
  const label = o => o._label ?? (o.netid ? nameOf(o.netid) : o.p && o.n ? `${PROGRAMS[o.p]} · ${o.n}` : o.n ?? JSON.stringify(o));
  return `<div class="addline" style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">
    <select class="txt" style="max-width:320px" data-addsel="${fc.key}">
      ${opts.map((o, i) => `<option value="${i}">${esc(label(o))}</option>`).join("")}
    </select>
    <button class="vbtn primary plain" data-addgo="${fc.key}">Add</button>
    <button class="vbtn plain" data-cancel="1">Cancel</button>
  </div>`;
}

/* ==========================================================================
   VARIANT B — One edit page per record
   The rail gains `Edit`, opening a single full page that asks everything you
   may change at once — #43's shape for creation, applied to editing.
   ========================================================================== */

function variantB(rec, r, actor) {
  if (ROUTE.page === "edit") return editPageB(rec, r, actor);

  const cards = classesFor(rec, r).map(fc => card(fc, readOnlyBody(rec, fc), { showClass: true })).join("");
  const classes = classesFor(rec, r);
  const anyOpen = classes.some(fc => verdict(fc, actor).ok);
  const railEdits = !canAct(actor) ? "" : `<div class="sec"><h3>Changes</h3>${
    anyOpen
      ? `<div class="editlist"><div class="item">
          <button data-goto="all">Edit this ${rec.kind === "offering" ? "class" : rec.kind === "course" ? "course" : "review"}</button>
          <span class="prov" style="color:var(--ink-faint)">${classes.filter(fc => verdict(fc, actor).ok).length} of ${classes.length} sections are yours</span>
        </div></div>`
      : `<div class="refusal" style="border:0;padding-left:0">Nothing on this page is yours to change.</div>
         ${classes.map(fc => refusalBlock(fc, verdict(fc, actor))).join("")}`
  }</div>`;
  return page(rec, r, actor, cards, rail(rec, r, actor, { edits: railEdits }));
}

function editPageB(rec, r, actor) {
  const classes = classesFor(rec, r);
  const open = classes.filter(fc => verdict(fc, actor).ok);
  const shut = classes.filter(fc => !verdict(fc, actor).ok);

  /* Keyed on the **record**, not on whether the operational class happens to be
     the one open to you. Every class on a `Concluded` class page is state-blind,
     so a director editing only the roster is correcting a finished term too. */
  const caution = (rec.kind === "offering" && r.state === "Concluded") ? concludedCaution() : "";
  /* B commits one Save across every class open to you, and on a review one of
     those tables is **shared with the other programmes reviewing** — so the one
     page has to say whose body it is about to rewrite. */
  const shared = open.some(fc => fc.shared) ? sharedBodyCaution(r) : "";
  const secs = open.map(fc => `
    <div class="formsec">
      <h2>${esc(fc.title)}</h2>
      <div class="lede">${fc.lede}</div>
      ${fc.fields.length ? `<div class="flist">${fc.fields.map(f => formField(rec, fc, f)).join("")}</div>` : ""}
      ${fc.rows ? rowBlock(rec, fc, { ok: true }, { editable: true }) : ""}
    </div>`).join("");

  const locked = shut.map(fc =>
    `<div style="margin-bottom:11px"><div style="font-size:12.5px;font-weight:600;margin-bottom:2px">${esc(fc.title)}</div>
     ${refusalBlock(fc, verdict(fc, actor)) || `<span class="prov">Not yours.</span>`}</div>`).join("");

  return `${crumb(rec, r)}
  <div class="page">
    <div>
      <div class="hdr">
        <div class="kicker">Editing</div>
        <h1>${esc(recordTitle(rec, r))}</h1>
        <div class="sub">Everything you may change, on one page. One Save commits the lot.</div>
      </div>
      ${caution}${shared}
      ${secs || `<div class="empty"><b>Nothing to edit</b>None of this record's field classes is open to you.</div>`}
    </div>
    ${rail(rec, r, actor, { editing: { title: recordTitle(rec, r), locked } })}
  </div>`;
}

function formField(rec, fc, f) {
  const val = valueOf(rec, fc, f) ?? "";
  const id = `${fc.key}:${f.k}`;
  let input;
  if (f.type === "textarea") input = `<textarea class="txt" data-in="${id}">${esc(val)}</textarea>`;
  else if (f.type === "select") input = `<select class="txt" data-in="${id}">${
    f.options().map(o => `<option${o === val ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  else if (f.type === "person") input = `<select class="txt" data-in="${id}">
    <option value="">— nobody —</option>${
    f.options().map(n => `<option value="${esc(n)}"${n === val ? " selected" : ""}>${esc(nameOf(n))}</option>`).join("")}</select>`;
  else input = `<input class="txt${f.type === "number" ? " short" : ""}" type="${f.type === "number" ? "number" : "text"}" value="${esc(val)}" data-in="${id}">`;
  return `<div class="fld"><label>${esc(f.label)}</label>${input}
    ${f.empty && !val ? `<div class="hint">${esc(f.empty)}</div>` : ""}</div>`;
}

function sharedBodyCaution(r) {
  const others = REVIEWS.filter(x => x.proposal === r.proposal && x.id !== r.id).map(x => PROGRAMS[x.prog]);
  return `<div class="caution"><b>This body is the proposal's, not this review's.</b> ${
    others.length ? `${esc(others.join(" and "))} ${others.length > 1 ? "are" : "is"} reading the same words` : "No other programme is reading it"
  }, and saving here changes what they see. The assignment below it belongs to ${esc(PROGRAMS[r.prog])} alone.</div>`;
}

function concludedCaution() {
  return `<div class="caution"><b>This class has concluded.</b> Changes here correct the record of a term that
    is over; they do not change what happened, and nothing about the class's progress moves.
    #8 left this open deliberately — the case it exists for is the wrong instructor being credited.</div>`;
}

/* ==========================================================================
   VARIANT C — Section by section
   Every section carries its own Edit, opening a small full page for that field
   class alone. One page = one writer = one state rule.
   ========================================================================== */

function variantC(rec, r, actor) {
  if (ROUTE.page === "edit") return editPageC(rec, r, actor);

  const cards = classesFor(rec, r).map(fc => {
    const v = verdict(fc, actor);
    const ctl = !v.speak ? ""
      : v.ok ? `<span class="spacer"></span><button class="vbtn plain" data-goto="${fc.key}" style="padding:3px 11px;font-size:12.5px">Edit</button>`
             : "";
    return card(fc, readOnlyBody(rec, fc) + refusalBlock(fc, v), { showClass: true, control: ctl });
  }).join("");
  return page(rec, r, actor, cards, rail(rec, r, actor));
}

function editPageC(rec, r, actor) {
  const fc = classesFor(rec, r).find(x => x.key === ROUTE.scope);
  if (!fc) { ROUTE = { page: "record", scope: null }; return VARIANTS[VI].render(rec, r, actor); }
  const v = verdict(fc, actor);
  const caution = fc.concluded ? concludedCaution() : "";
  const shared = fc.shared
    ? `<div class="caution">This body is <b>shared with every programme reviewing the proposal</b>.
       ${REVIEWS.filter(x => x.proposal === r.proposal).map(x => PROGRAMS[x.prog]).join(", ")} are all reading it.</div>` : "";
  return `${crumb(rec, r)}
  <div class="page">
    <div>
      <div class="hdr">
        <div class="kicker">Editing · ${esc(fc.cls)}</div>
        <h1>${esc(fc.title)} — ${esc(recordTitle(rec, r))}</h1>
        <div class="sub">${fc.lede}</div>
      </div>
      ${caution}${shared}
      ${v.ok ? `
        ${fc.fields.length ? `<div class="flist" style="margin-bottom:18px">${fc.fields.map(f => formField(rec, fc, f)).join("")}</div>` : ""}
        ${fc.rows ? rowBlock(rec, fc, v, { editable: true }) : ""}`
      : `<div class="empty"><b>Not open to you</b>This page has a URL, so it answers.</div>${refusalBlock(fc, v)}`}
    </div>
    ${rail(rec, r, actor, { editing: { title: fc.title, locked: "" } })}
  </div>`;
}

/* ==========================================================================
   VARIANT D — In the rail
   The record carries no controls at all. The rail lists the changes you may
   make beneath the transitions you may fire, refused the same way.
   ========================================================================== */

function variantD(rec, r, actor) {
  if (ROUTE.page === "edit") return editPageC(rec, r, actor);

  const cards = classesFor(rec, r).map(fc => card(fc, readOnlyBody(rec, fc), { showClass: true })).join("");
  const classes = classesFor(rec, r);
  const railEdits = !canAct(actor) ? "" : `<div class="sec"><h3>Changes you may make</h3>
    <div class="editlist">${classes.map(fc => {
      const v = verdict(fc, actor);
      return `<div class="item">${
        v.ok ? `<button data-goto="${fc.key}">${esc(changeVerb(rec, fc))}</button>`
             : `<div class="dead">${esc(changeVerb(rec, fc))}</div>${refusalBlock(fc, v)}`}</div>`;
    }).join("")}</div></div>`;
  return page(rec, r, actor, cards, rail(rec, r, actor, { edits: railEdits }));
}

const CHANGE_VERB = {
  body: "Rewrite the course body",
  assignment: "Assign the area and head",
  operational: "Change how this section runs",
  seats: "Share seats with another programme",
  roster: "Change the co-instructors",
  proposalBody: "Rewrite the proposal",
  reviewAssignment: "Assign this programme's area and head",
};
const changeVerb = (rec, fc) => CHANGE_VERB[fc.key] ?? `Edit the ${fc.title.toLowerCase()}`;

/* ==========================================================================
   Shared page frame
   ========================================================================== */

function card(fc, body, { showClass = false, control = "" } = {}) {
  return `<div class="card">
    <h2>${esc(fc.title)}${showClass ? `<span class="cls">${esc(fc.cls)}</span>` : ""}${control}</h2>
    <div class="body">${body}</div></div>`;
}

function readOnlyBody(rec, fc) {
  const rows = fc.fields.map(f =>
    `<div class="k">${esc(f.label)}</div><div class="v">${renderValue(rec, fc, f)}</div>`).join("");
  return [
    fc.fields.length ? `<div class="fields">${rows}</div>` : "",
    fc.rows ? rowBlock(rec, fc, { ok: false }, { editable: false }) : "",
  ].filter(Boolean).join("");
}

function recordTitle(rec, r) {
  if (rec.kind === "course") return r.title;
  if (rec.kind === "offering") return `${courseOf(r.course).title} §${r.section}, ${TERMS[r.term]}`;
  return `${r.proposalRow.title} — ${PROGRAMS[r.prog]}`;
}

function crumb(rec, r) {
  return `<div class="crumb"><a data-back="1">← ${esc(recordTitle(rec, r))}</a>
    <span style="color:var(--ink-faint)">/ editing</span></div>`;
}

function page(rec, r, actor, cards, railHtml) {
  const canRead = rec.kind !== "offering" || canAct(actor) || COMMITTED.includes(r.state);
  if (!canRead) return `<div class="page"><div><div class="empty" style="margin-top:26px">
    <b>Not available</b>There is nothing to show at this address.</div></div><div></div></div>`;
  return `<div class="page"><div>${header(rec, r)}${cards}${history(rec, r)}</div>${railHtml}</div>`;
}

/* ==========================================================================
   Driver
   ========================================================================== */

/* B first — it is the settled answer, and the file opens on it. A, C and D
   follow as the primary source it was chosen against (#41's convention). */
const VARIANTS = [
  { key:"B", name:"One edit page — settled", render: variantB },
  { key:"A", name:"In place",                render: variantA },
  { key:"C", name:"Section by section",      render: variantC },
  { key:"D", name:"In the rail",             render: variantD },
];

let VI = 0;
let AI = 0;
let RK = RECORDS[0].key;
let ROUTE = { page: "record", scope: null };

const ACTOR = () => ACTORS[AI];
const RECORD = () => RECORDS.find(x => x.key === RK);

const $ = s => document.querySelector(s);

function reset() { OPEN_FIELD = null; OPEN_ADD = null; ROUTE = { page: "record", scope: null }; }

function render() {
  const rec = RECORD();
  const r = load(rec);
  const actor = ACTOR();
  $("#vkey").textContent = VARIANTS[VI].key;
  $("#vname").textContent = VARIANTS[VI].name;
  $("#note").textContent = rec.note;
  /* Variant A has no edit route at all — switching to it from one drops you back. */
  if (VARIANTS[VI].key === "A" && ROUTE.page === "edit") ROUTE = { page: "record", scope: null };
  $("#view").innerHTML = VARIANTS[VI].render(rec, r, actor);
}

/* --- pickers ------------------------------------------------------------ */

$("#actor").innerHTML = ACTORS.map((a, i) => `<option value="${i}">${esc(a.label)}</option>`).join("");
$("#record").innerHTML = RECORDS.map(x => `<option value="${esc(x.key)}">${esc(x.label)}</option>`).join("");

$("#actor").addEventListener("change", e => { AI = Number(e.target.value); reset(); render(); });
$("#record").addEventListener("change", e => { RK = e.target.value; reset(); render(); });
/* Switching variant returns to the record. The four disagree about which edit
   routes exist at all, so carrying one across is carrying it into a variant
   that may not have it. */
$("#prev").addEventListener("click", () => { VI = (VI + VARIANTS.length - 1) % VARIANTS.length; reset(); render(); });
$("#next").addEventListener("click", () => { VI = (VI + 1) % VARIANTS.length; reset(); render(); });
addEventListener("keydown", e => {
  if (e.target.matches("input, textarea, select")) return;
  if (e.key === "ArrowLeft")  $("#prev").click();
  if (e.key === "ArrowRight") $("#next").click();
});

/* --- one delegated handler for every variant ---------------------------- */

$("#view").addEventListener("click", e => {
  const rec = RECORD();
  const r = load(rec);
  const classes = classesFor(rec, r);
  const find = k => classes.find(c => c.key === k);
  const t = e.target.closest("[data-open],[data-save],[data-cancel],[data-add],[data-addgo],[data-del],[data-goto],[data-back],[data-act]");
  if (!t) return;

  if (t.dataset.open) { OPEN_FIELD = t.dataset.open; OPEN_ADD = null; return render(); }
  if (t.dataset.cancel) { OPEN_FIELD = null; OPEN_ADD = null; return render(); }

  if (t.dataset.save) {
    const [ck, fk] = t.dataset.save.split(":");
    const fc = find(ck), f = fc.fields.find(x => x.k === fk);
    const el = $(`[data-in="${CSS.escape(t.dataset.save)}"]`);
    let val = el.value;
    if (f.type === "number") val = val === "" ? null : Number(val);
    if (val === "") val = null;
    setField(rec, fc, f.k, val);
    OPEN_FIELD = null;
    return render();
  }

  if (t.dataset.add) { OPEN_ADD = t.dataset.add; OPEN_FIELD = null; return render(); }
  if (t.dataset.addgo) {
    const fc = find(t.dataset.addgo);
    const sel = $(`[data-addsel="${CSS.escape(t.dataset.addgo)}"]`);
    const opt = fc.rows.options()[Number(sel.value)];
    const { _label, ...clean } = opt;
    addRow(rec, fc, clean);
    OPEN_ADD = null;
    return render();
  }
  if (t.dataset.del) {
    const [ck, i] = t.dataset.del.split(":");
    removeRow(rec, find(ck), Number(i));
    return render();
  }

  if (t.dataset.goto) { ROUTE = { page: "edit", scope: t.dataset.goto }; OPEN_ADD = null; return render(); }
  if (t.dataset.back) { reset(); return render(); }

  if (t.dataset.act === "cancel") { reset(); return render(); }
    const stamp = nowStamp();
    const actorNetid = ACTOR().netid;
    const touched = new Set();

    document.querySelectorAll("[data-in]").forEach(el => {
      const [ck, fk] = el.dataset.in.split(":");
      const fc = find(ck); if (!fc) return;
      const f = fc.fields.find(x => x.k === fk); if (!f) return;
      let val = el.value;
      if (f.type === "number") val = val === "" ? null : Number(val);
      if (val === "") val = null;

      const row = holder(rec, fc);
      row[f.k] = val;
      touched.add(row);
    });

    touched.forEach(row => { row.updatedBy = actorNetid; row.updatedAt = stamp; });
    LAST_WRITE = { key: rec.key, at: Date.now() };
    reset();
    return render();
  }
});

render();
</script>
